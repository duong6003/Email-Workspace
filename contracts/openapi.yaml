    delete:
      operationId: removeRecipientListMembers
      parameters: [{$ref: '#/components/parameters/RecipientListId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SegmentMembersRequest'}
      responses: {'204': {description: Memberships removed}, '400': {$ref: '#/components/responses/Problem'}, '403': {$ref: '#/components/responses/Problem'}, '404': {$ref: '#/components/responses/Problem'}}
  /recipients/{recipientId}/segments:
    get:
      operationId: getRecipientSegments
      description: 'BR-SEG-007 / BR-REC-005/006: canonical list/tag membership for a recipient, consumed by the recipient table and form.'
      parameters: [{$ref: '#/components/parameters/RecipientId'}]
      responses:
        '200':
          description: Recipient segment memberships
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RecipientSegments'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /tags:
    get:
      operationId: listTags
      description: 'BR-SEG-001/003/004/007/010: tenant-scoped flexible tags with server-computed active-recipient counts.'
      parameters:
        - {$ref: '#/components/parameters/SegmentSearch'}
        - {$ref: '#/components/parameters/SegmentCursor'}
        - {$ref: '#/components/parameters/SegmentLimit'}
      responses:
        '200':
          description: Stable name/id ordered page of tags
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TagCatalogResponse'}
        '403': {$ref: '#/components/responses/Problem'}
    post:
      operationId: createTag
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TagCreateRequest'}
      responses:
        '201':
          description: Tag created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Tag'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /tags/{tagId}:
    get:
      operationId: getTag
      parameters: [{$ref: '#/components/parameters/TagId'}]
      responses:
        '200':
          description: Tag
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Tag'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
    patch:
      operationId: updateTag
      parameters: [{$ref: '#/components/parameters/TagId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TagUpdateRequest'}
      responses:
        '200':
          description: Tag updated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Tag'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
    delete:
      operationId: deleteTag
      description: 'BR-SEG-006: soft-deletes the tag and removes only tag memberships; recipients and custom data remain unchanged.'
      parameters: [{$ref: '#/components/parameters/TagId'}]
