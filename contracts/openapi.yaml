  /tags/{tagId}/members:
    post:
      operationId: addTagMembers
      parameters: [{$ref: '#/components/parameters/TagId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SegmentMembersRequest'}
      responses: {'201': {description: Memberships added idempotently}, '400': {$ref: '#/components/responses/Problem'}, '403': {$ref: '#/components/responses/Problem'}, '404': {$ref: '#/components/responses/Problem'}}
    delete:
      operationId: removeTagMembers
      parameters: [{$ref: '#/components/parameters/TagId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SegmentMembersRequest'}
      responses: {'204': {description: Memberships removed}, '400': {$ref: '#/components/responses/Problem'}, '403': {$ref: '#/components/responses/Problem'}, '404': {$ref: '#/components/responses/Problem'}}
  /custom-fields:
    get:
      operationId: listCustomFields
      description: 'BR-CF-001/002: admin-defined typed custom-field schema for the tenant. Consumed by the recipient add/edit form and, from M4 onward, the compose variable panel.'
      responses:
        '200':
          description: Custom field schema
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CustomFieldListResponse'}
        '403': {$ref: '#/components/responses/Problem'}
    post:
      operationId: createCustomField
      description: 'BR-CF-001: key is a-z/0-9/underscore starting with a letter, unique per tenant, immutable after creation. BR-CF-003: a reserved system key (email, first_name, last_name, unsubscribe_url) is rejected with 422 and the reserved-key list.'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CustomFieldCreateRequest'}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CustomField'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/CustomFieldReservedKeyProblem'}
  /custom-fields/{customFieldId}:
    get:
      operationId: getCustomField
      parameters:
        - {$ref: '#/components/parameters/CustomFieldId'}
      responses:
        '200':
          description: Custom field
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CustomField'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
    patch:
      operationId: updateCustomField
      description: 'BR-CF-001: "đổi label không đổi key" -- the request body never accepts key; a body that includes it is rejected with 400.'
      parameters:
        - {$ref: '#/components/parameters/CustomFieldId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CustomFieldUpdateRequest'}
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CustomField'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
    delete:
      operationId: deleteCustomField
      parameters:
        - {$ref: '#/components/parameters/CustomFieldId'}
      responses:
        '204': {description: Deleted only when no active draft or published template references the field key}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /import-jobs:
    get:
      operationId: listImportJobs
      description: "Lists the current tenant's most recent import jobs. The response is the authoritative history backing the recipient import view."
      responses:
        '200':
          description: Tenant-scoped import history
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/ImportJob'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
    post:
      operationId: createImportJob
      description: 'M2-S4 / BR-GEN-005, BR-IMP-002/004/006/007: persists a validated, bounded import preview as a durable job. Idempotency-Key replays the original accepted job for an identical request and returns 409 for a changed payload.'
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ImportJobCreateRequest'}
      responses:
        '202':
          description: Import job accepted; `idempotencyReplayed` distinguishes a new job from a same-key replay.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ImportJob'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /import-jobs/preview:
    post:
      operationId: previewImportJob
      description: 'Validates up to the first 20 import rows against the current tenant custom-field schema without creating a job.'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ImportJobCreateRequest'}
      responses:
        '200':
          description: Cell-level import preview
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ImportPreview'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /import-jobs/{importJobId}:
    get:
      operationId: getImportJob
      description: 'Reads the tenant-scoped canonical job state; realtime events are hints and this endpoint remains authoritative.'
      parameters:
        - {$ref: '#/components/parameters/ImportJobId'}
      responses:
        '200':
          description: Import job
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ImportJob'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /import-jobs/{importJobId}/error-file:
    get:
      operationId: downloadImportErrorFile
      description: 'Downloads failed import rows with row number, machine-readable reason, and original source payload. The job remains tenant-scoped.'
      parameters:
        - {$ref: '#/components/parameters/ImportJobId'}
      responses:
        '200':
          description: CSV file of failed rows; header-only when the job has no failures.
          content:
            text/csv:
              schema: {type: string, format: binary}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /campaigns:
    get:
      operationId: listCampaigns
      parameters:
        - {name: status, in: query, required: false, schema: {type: string, enum: [draft, scheduled, queued, validating, sending, paused, completed, partial_failed, failed, cancelled], default: draft}}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
        - {name: scope, in: query, required: false, description: 'Defaults to drafts owned by the caller. Admin may request all tenant drafts.', schema: {type: string, enum: [mine, all], default: mine}}
      responses: {'200': {description: Tenant-scoped draft list, content: {application/json: {schema: {$ref: '#/components/schemas/CampaignListResponse'}}}}, '403': {$ref: '#/components/responses/Problem'}}
    post:
      operationId: createCampaignDraft
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CampaignDraftCreateRequest'}
      responses: {'201': {description: Draft created, headers: {ETag: {$ref: '#/components/headers/CampaignETag'}}, content: {application/json: {schema: {$ref: '#/components/schemas/Campaign'}}}}, '400': {$ref: '#/components/responses/Problem'}, '403': {$ref: '#/components/responses/Problem'}, '422': {$ref: '#/components/responses/Problem'}}
  /campaigns/{campaignId}:
    get:
      operationId: getCampaign
      parameters:
        - {$ref: '#/components/parameters/CampaignId'}
      responses: {'200': {description: Tenant-scoped campaign draft, headers: {ETag: {$ref: '#/components/headers/CampaignETag'}}, content: {application/json: {schema: {$ref: '#/components/schemas/Campaign'}}}}, '403': {$ref: '#/components/responses/Problem'}, '404': {$ref: '#/components/responses/Problem'}}
    patch:
      operationId: updateCampaignDraft
      parameters:
        - {$ref: '#/components/parameters/CampaignId'}
        - {$ref: '#/components/parameters/IfMatch'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CampaignDraftUpdateRequest'}
      responses: {'200': {description: Draft updated, headers: {ETag: {$ref: '#/components/headers/CampaignETag'}}, content: {application/json: {schema: {$ref: '#/components/schemas/Campaign'}}}}, '400': {$ref: '#/components/responses/Problem'}, '403': {$ref: '#/components/responses/Problem'}, '404': {$ref: '#/components/responses/Problem'}, '409': {$ref: '#/components/responses/Problem'}, '412': {$ref: '#/components/responses/Problem'}, '428': {$ref: '#/components/responses/Problem'}}
    delete:
      operationId: deleteCampaignDraft
      parameters:
        - {$ref: '#/components/parameters/CampaignId'}
        - {$ref: '#/components/parameters/IfMatch'}
      responses: {'204': {description: Draft soft-deleted}, '403': {$ref: '#/components/responses/Problem'}, '404': {$ref: '#/components/responses/Problem'}, '409': {$ref: '#/components/responses/Problem'}, '412': {$ref: '#/components/responses/Problem'}, '428': {$ref: '#/components/responses/Problem'}}
  /campaigns/{campaignId}/duplicate:
    post:
      operationId: duplicateCampaign
      parameters:
        - {$ref: '#/components/parameters/CampaignId'}
      responses: {'201': {description: Independent draft copy, headers: {ETag: {$ref: '#/components/headers/CampaignETag'}}, content: {application/json: {schema: {$ref: '#/components/schemas/Campaign'}}}}, '403': {$ref: '#/components/responses/Problem'}, '404': {$ref: '#/components/responses/Problem'}}
  /campaigns/{campaignId}/audience/preview:
    post:
      operationId: previewCampaignAudience
      description: >-
        Read-only and side-effect free despite the POST verb: the audience
        may not yet be saved to the draft (the picker previews before
        committing), so it is supplied in the request body rather than read
        from the stored campaign.
      parameters:
        - {$ref: '#/components/parameters/CampaignId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PreviewCampaignAudienceRequest'}
      responses: {'200': {description: Deduplicated, eligibility-filtered audience resolution, content: {application/json: {schema: {$ref: '#/components/schemas/AudienceResolution'}}}}, '403': {$ref: '#/components/responses/Problem'}, '404': {$ref: '#/components/responses/Problem'}, '422': {$ref: '#/components/responses/Problem'}}
  /campaigns/{campaignId}/validate-audience:
    post:
      operationId: validateCampaignAudience
      description: >-
        Read-only despite the POST verb: reads the draft's own saved
        template and audience rather than an unsaved body -- once a
        template is attached there is nothing new to preview, unlike
        audience/preview. Replaces the arch_contracts-era
        /templates/{templateId}/validate-audience stub, which named the
        wrong resource: a template id alone cannot produce a resolved
        campaign audience to validate variables against.
      parameters:
        - {$ref: '#/components/parameters/CampaignId'}
      responses: {'200': {description: Missing-required-variable matrix over the actionable audience, content: {application/json: {schema: {$ref: '#/components/schemas/ValidateCampaignAudienceResponse'}}}}, '403': {$ref: '#/components/responses/Problem'}, '404': {$ref: '#/components/responses/Problem'}}
  /campaigns/{campaignId}/preflight:
    get:
      operationId: getCampaignPreflight
      description: Read-only send/schedule checklist. Blocking checks are authoritative; content and domain readiness are warnings.
      parameters: [{$ref: '#/components/parameters/CampaignId'}]
      responses:
        '200': {description: Current campaign preflight report, content: {application/json: {schema: {$ref: '#/components/schemas/CampaignScheduleValidationReport'}}}}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /campaigns/{campaignId}/audience-waiver:
    post:
      operationId: acceptCampaignAudienceWaiver
      description: >-
        BR-CMP-005's accepted-resolution path: records an audited decision
        to exclude every recipient the server *currently* computes as
        missing a required variable. The set is always recomputed
        server-side, never taken from the request body -- there is no
        request body -- so the client can never under- or over-state who
        gets excluded from a compliance-adjacent decision.
      parameters:
        - {$ref: '#/components/parameters/CampaignId'}
        - {$ref: '#/components/parameters/IfMatch'}
      responses:
        '201':
          description: Waiver accepted and persisted on the draft
          headers: {ETag: {$ref: '#/components/headers/CampaignETag'}}
          content: {application/json: {schema: {$ref: '#/components/schemas/Campaign'}}}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '412': {$ref: '#/components/responses/Problem'}
        '428': {$ref: '#/components/responses/Problem'}
  /campaigns/{campaignId}/schedule:
    post:
      operationId: scheduleCampaign
      description: >-
        M5-S2 (BR-SCH-001/002/004/005, BR-GEN-003, DEC-080/090/093): shares
        freezeCampaignSnapshot with sendCampaign (one freeze path). Also the
        reschedule route -- called again on an already-scheduled or blocked
        campaign, it supersedes the live snapshot and freezes a new one in
        the same transaction (DEC-090/091). `localDateTime` is deliberately
        zone-less (DEC-093): pairing it with an offset would let the client
        pre-resolve the DST ambiguity BR-SCH-003 exists to force into the
        open. Previously a bodyless mock; the response body and required
        header are new on an operation no client could have depended on,
        since it was never implemented (same justification M4-S3/M4-S4 used
        for their own stub removals).
      parameters:
        - {$ref: '#/components/parameters/CampaignId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CampaignScheduleRequest'}
      responses:
        '202':
          description: Snapshot frozen and campaign scheduled
          content: {application/json: {schema: {$ref: '#/components/schemas/CampaignScheduleAccepted'}}}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422':
          description: 'A blocking validation report (BR-SCH-004), or a zone-resolution failure (BR-SCH-001/003): UNKNOWN_TIME_ZONE, NONEXISTENT_LOCAL_TIME, AMBIGUOUS_LOCAL_TIME or OUT_OF_SCHEDULE_WINDOW.'
          content: {application/json: {schema: {$ref: '#/components/schemas/CampaignScheduleValidationReport'}}}
  /campaigns/{campaignId}/schedule/cancel:
    post:
      operationId: cancelCampaignSchedule
      description: >-
        M5-S2 (BR-SCH-008, DEC-091): a separate route from /cancel because
        the two have different legal source states (scheduled here, queued
        there) and different terminal states (cancelled here, draft there --
        a cancelled *schedule* is terminal, unlike M4-S4's cancel-to-refresh).
        Refused 409 inside the lock window, same as a reschedule.
      parameters:
        - {$ref: '#/components/parameters/CampaignId'}
      responses:
        '202':
          description: Schedule cancelled
          content: {application/json: {schema: {$ref: '#/components/schemas/CampaignScheduleCancelAccepted'}}}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /campaigns/{campaignId}/send:
    post:
      operationId: sendCampaign
      description: >-
        M4-S4 (BR-CMP-007, BR-CMP-010, BR-TPL-001/012, BR-CF-008): freezes
        the resolved audience, merge data and rendered content into an
        immutable campaign_snapshot, moving the campaign from draft to
        queued. Idempotency-Key is required (BR-GEN-005) -- the same key and
        payload replays the prior result rather than creating a second
        snapshot; the same key with a different payload is rejected 409.
        Previously a bodyless mock; the response body and required header
        are new on an operation no client could have depended on, since it
        was never implemented (same justification M4-S3 used for its own
        stub removal).

        M5-GATE (BR-CFG-002, D-112): refuses 422 `SENDER_NOT_VERIFIED` /
        `SENDER_NOT_FOUND` when the campaign's sender config is not verified
        and active -- previously only the schedule route enforced this, so an
        unusable sender reached the worker as a queued campaign.
      parameters:
        - {$ref: '#/components/parameters/CampaignId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        '202':
          description: Snapshot frozen and queued for send
          content: {application/json: {schema: {$ref: '#/components/schemas/CampaignSnapshotAccepted'}}}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422':
          description: 'BR-CFG-002: the campaign sender is missing, absent or not verified (`code`: SENDER_MISSING, SENDER_NOT_FOUND, SENDER_NOT_VERIFIED).'
          content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}
        '429': {$ref: '#/components/responses/Problem'}
  /campaigns/{campaignId}/progress:
    get:
      operationId: getCampaignProgress
      description: >-
        M5-S3 CP6 (BR-SEND-002, D-92): real per-status counts from
        campaign_recipient, recomputed on read. Previously an in-memory mock
        returning fabricated counts and a fabricated eta for any id,
        including one that did not exist -- no client could have depended on
        that behaviour, since it was never a real implementation (the same
        justification M4-S3/M4-S4/M5-S2 each already used for their own
        stub removals).
      parameters:
        - {$ref: '#/components/parameters/CampaignId'}
      responses:
        '200':
          description: Canonical progress
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CampaignProgress'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /campaigns/{campaignId}/recipients:
    get:
      operationId: getCampaignRecipients
      description: 'BR-HIS-003: tenant-scoped recipient drill-down over the live frozen snapshot, including the latest attempt classification and safe failure reason. Viewer-readable; bulk export remains separately gated by history:export.'
      parameters:
        - {$ref: '#/components/parameters/CampaignId'}
        - {name: status, in: query, required: false, schema: {$ref: '#/components/schemas/CampaignRecipientStatus'}}
        - {name: search, in: query, required: false, schema: {type: string, minLength: 1, maxLength: 320}}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
        - {name: cursor, in: query, required: false, schema: {type: string}}
      responses:
        '200': {description: Recipient delivery result page, content: {application/json: {schema: {$ref: '#/components/schemas/CampaignRecipientHistoryPage'}}}}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /campaigns/{campaignId}/send/cancel:
    post:
      operationId: cancelCampaignSend
      description: >-
        M5-S3 CP6 (BR-SEND-010, A18). A separate route from
        /campaigns/{id}/cancel (M4-S4, legal only while queued -- supersedes
        the snapshot and returns to draft) and
        /campaigns/{id}/schedule/cancel (M5-S2, legal only while scheduled)
        -- DEC-091's precedent: each has a different legal source state and a
        different terminal effect, and overloading one route would make the
        409 messages unreadable and hide which rule refused. Legal only
        while sending: flips every not-yet-submitted recipient to
        cancelled and leaves already-submitted ones untouched (they keep
        receiving delivery events via M5-S4), reporting both counts
        separately. Idempotency-Key is required (BR-GEN-005).
      parameters:
        - {$ref: '#/components/parameters/CampaignId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        '202':
          description: Not-yet-submitted recipients cancelled; already-submitted ones untouched
          content: {application/json: {schema: {$ref: '#/components/schemas/CampaignSendCancelAccepted'}}}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /campaigns/{campaignId}/cancel:
    post:
      operationId: cancelCampaign
      description: >-
        M4-S4 (BR-CMP-007, BR-CF-008): the only refresh path -- supersedes
        the live snapshot (kept, immutable, readable) and returns the
        campaign to draft so a subsequent send freezes a genuinely new
        snapshot. Only legal while queued; any other status is 409.
      parameters:
        - {$ref: '#/components/parameters/CampaignId'}
      responses:
        '202':
          description: Frozen snapshot superseded; campaign returned to draft
          content: {application/json: {schema: {$ref: '#/components/schemas/CampaignSnapshotAccepted'}}}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /campaigns/{campaignId}/snapshot:
    get:
      operationId: getCampaignSnapshot
      description: >-
        M4-S4: the live (not superseded) frozen snapshot for this campaign
        -- the read surface the compose screen's frozen banner and
        post-freeze evidence both use. Superseded snapshots are retained but
        reachable only through the database; a history endpoint is out of
        this node's scope (M6-S3-history-recovery).
      parameters:
        - {$ref: '#/components/parameters/CampaignId'}
      responses:
        '200':
          description: The live frozen snapshot for this campaign
          content: {application/json: {schema: {$ref: '#/components/schemas/CampaignSnapshot'}}}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /campaigns/history:
    get:
      operationId: getCampaignHistory
      description: >-
        M6-S3 (BR-HIS-001/004), widened by ADR-034. Newest-first
        server-paginated campaign list -- distinct from GET /campaigns (M4-S1's
        drafts list, status='draft' default, CONTENT_MANAGE-guarded): this
        route is viewer-readable (CAMPAIGN_READ) and defaults to every
        non-draft status. Pass includeDrafts to cover the whole campaign
        lifecycle; draft rows are then returned only to a caller holding
        content:manage, and only their own drafts unless they are an admin
        with settings:manage. A caller without content:manage is silently
        downgraded to the non-draft result rather than refused, because a 403
        would blank a list they are entitled to read. serverTime
        is the top-level anchor every client-side countdown must be computed
        against, never the client's own clock (BR-HIS-004). A row's progress
        is null until a live execution exists -- "no progress before start"
        falls out of the data model rather than being special-cased.
      parameters:
        - {name: status, in: query, schema: {enum: [draft, scheduled, blocked, missed, queued, validating, sending, paused, completed, partial_failed, failed, cancelled]}}
        - {name: dateFrom, in: query, schema: {type: string, format: date-time}}
        - {name: dateTo, in: query, schema: {type: string, format: date-time}}
        - {name: senderConfigId, in: query, schema: {type: string, format: uuid}}
        - {name: createdBy, in: query, schema: {type: string, format: uuid}}
        - {name: search, in: query, schema: {type: string, maxLength: 200}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 25}}
        - {name: cursor, in: query, schema: {type: string}}
        - {name: includeDrafts, in: query, schema: {type: boolean, default: false}}
        - {name: scope, in: query, schema: {enum: [mine, all]}}
      responses:
        '200': {description: A page of send history, content: {application/json: {schema: {$ref: '#/components/schemas/CampaignHistoryPage'}}}}
        '403': {$ref: '#/components/responses/Problem'}
  /campaigns/bulk:
    post:
      operationId: bulkCampaignAction
      description: >-
        ADR-034. Synchronous bulk action over a bounded campaign selection.
        Each campaign is applied in its own transaction and reported
        individually: a precondition failure is `skipped` with a reason code,
        an error is `failed`, and neither stops the remaining rows. The route
        is guarded by CAMPAIGN_READ only as a floor -- the real permission
        differs per action (content:manage for delete/duplicate,
        campaign:manage for cancel) and is checked against the body. `cancel`
        dispatches by the campaign's current status across schedule
        cancellation, queued cancellation and in-flight send cancellation.
        Deliberately carries no If-Match (N versions cannot travel in one
        request; a moved version comes back as CAMPAIGN_VERSION_CONFLICT for
        that row alone) and no Idempotency-Key (the call is synchronous and
        the client disables the control while it is in flight).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, campaignIds]
              additionalProperties: false
              properties:
                action: {enum: [delete, duplicate, cancel]}
                campaignIds: {type: array, minItems: 1, maxItems: 100, items: {type: string, format: uuid}}
      responses:
        '200':
          description: Per-campaign outcomes
          content:
            application/json:
              schema:
                type: object
                required: [results, succeeded, failed, skipped]
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      required: [campaignId, outcome, code, message]
                      properties:
                        campaignId: {type: string, format: uuid}
                        outcome: {enum: [succeeded, failed, skipped]}
                        code: {type: string}
                        message: {type: string}
                  succeeded: {type: integer}
                  failed: {type: integer}
                  skipped: {type: integer}
        '403': {$ref: '#/components/responses/Problem'}
  /campaigns/{campaignId}/pause:
    post:
      operationId: pauseCampaign
      description: >-
        M6-S3 (BR-SEND-009, ADR-027). Legal only from 'sending'. Effect
        within 10 seconds is enforced inside the worker's own send loop
        (a bounded re-check), not by this route alone -- the scheduler's
        60-second scan cadence cannot meet the bound on its own (D-123).
        Already-submitted messages are never recalled.
      parameters:
        - {$ref: '#/components/parameters/CampaignId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        '202': {description: Campaign moved to paused, content: {application/json: {schema: {$ref: '#/components/schemas/CampaignPauseResumeAccepted'}}}}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /campaigns/{campaignId}/resume:
    post:
      operationId: resumeCampaign
      description: 'M6-S3 (BR-SEND-009, ADR-027). Legal only from ''paused''; continues the remaining unsent recipients without resubmitting any already-submitted one.'
      parameters:
        - {$ref: '#/components/parameters/CampaignId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        '202': {description: Campaign resumed to sending, content: {application/json: {schema: {$ref: '#/components/schemas/CampaignPauseResumeAccepted'}}}}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /campaigns/{campaignId}/resend:
    post:
      operationId: resendCampaign
      description: >-
        M6-S3 (BR-HIS-005, ADR-027, DEC-133). Legal only from
        partial_failed/failed, and only when at least one failed sendable
        recipient exists on the parent's live snapshot. Creates a *new*
        snapshot generation (parent_snapshot_id set) carrying only the
        parent's failed recipients, superseding the parent, and a new
        execution linked via parentExecutionId -- never reuses the parent
        snapshot (see ADR-027's own rationale: the DAG's own idempotency key
        depends on this).
      parameters:
        - {$ref: '#/components/parameters/CampaignId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        '202': {description: A new execution created over the parent's failed recipients, content: {application/json: {schema: {$ref: '#/components/schemas/CampaignResendAccepted'}}}}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /campaigns/{campaignId}/exports:
    post:
      operationId: createCampaignExport
      description: >-
        M6-S3 (BR-HIS-003/007). Gated by history:export, not campaign:read
        or campaign:manage -- the viewer already holds campaign:read, which
        this rule says must not be sufficient to export recipient-level PII
        in bulk. Renders inline at or below EXPORT_INLINE_MAX_ROWS;
        otherwise stays queued for the worker's own export-scan. Never
        includes a secret_ref or any field drawn from sender_config/app_user
        by construction (the renderer never joins those tables).
      parameters:
        - {$ref: '#/components/parameters/CampaignId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                kind: {enum: [campaign_recipients, campaign_failures], default: campaign_recipients}
                statusFilter: {type: array, maxItems: 8, items: {enum: [pending, queued, submitted, delivered, bounced, failed, skipped, cancelled]}}
      responses:
        '202': {description: Export job created (queued or already completed), content: {application/json: {schema: {$ref: '#/components/schemas/CampaignExport'}}}}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /campaigns/{campaignId}/exports/{exportId}:
    get:
      operationId: getCampaignExport
      description: M6-S3 (BR-HIS-003/007). Status of a single export job -- the client polls this until status is completed or failed.
      parameters:
        - {$ref: '#/components/parameters/CampaignId'}
        - {name: exportId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Export job status, content: {application/json: {schema: {$ref: '#/components/schemas/CampaignExport'}}}}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /campaigns/{campaignId}/exports/{exportId}/file:
    get:
      operationId: downloadCampaignExport
      description: >-
        M6-S3 (BR-HIS-007). 404 unless the job belongs to this tenant and
        campaign and is completed with a real artifact -- a wrong-tenant
        export id gets the identical 404 a nonexistent one would, never
        leaking cross-tenant existence. 410 once past expires_at, serving no
        bytes. Every successful download increments downloaded_count and
        appends one audit_log row in the same transaction as the read.
      parameters:
        - {$ref: '#/components/parameters/CampaignId'}
        - {name: exportId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: The export artifact, content: {text/csv: {schema: {type: string, format: binary}}}}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '410': {$ref: '#/components/responses/Problem'}
  /notifications:
    get:
      operationId: listNotifications
      parameters:
        - {name: unread, in: query, schema: {type: boolean, default: false}}
        - {name: cursor, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
      responses:
        '200': {description: Durable notification page, content: {application/json: {schema: {$ref: '#/components/schemas/NotificationPage'}}}}
        '403': {$ref: '#/components/responses/Problem'}
  /notifications/{notificationId}/read:
    put:
      operationId: markNotificationRead
      parameters:
        - name: notificationId
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses: {'204': {description: Read state persisted}, '403': {$ref: '#/components/responses/Problem'}, '404': {$ref: '#/components/responses/Problem'}}
  /notifications/{notificationId}/deep-link:
    get:
      operationId: resolveNotificationDeepLink
      description: Rechecks the current user permission and target existence before returning a notification route. An unavailable response never includes a route or target payload.
      parameters:
        - name: notificationId
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200': {description: Authorized route or safe unavailable state, content: {application/json: {schema: {$ref: '#/components/schemas/NotificationDeepLink'}}}}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /notifications/read-all:
    put:
      operationId: markAllNotificationsRead
      responses: {'204': {description: Read state persisted}, '403': {$ref: '#/components/responses/Problem'}}
  /notifications/{notificationId}/action-state:
    patch:
      operationId: updateNotificationActionState
      parameters: [{name: notificationId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/NotificationActionStateRequest'}}}}
      responses: {'204': {description: Action state persisted}, '403': {$ref: '#/components/responses/Problem'}}
  /notification-preferences:
    get:
      operationId: getNotificationPreferences
      responses: {'200': {description: Notification preferences}, '403': {$ref: '#/components/responses/Problem'}}
    put:
      operationId: updateNotificationPreferences
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/NotificationPreferenceRequest'}}}}
      responses: {'200': {description: Notification preference}, '403': {$ref: '#/components/responses/Problem'}}
  /bulk-jobs:
    get:
      operationId: listBulkJobs
      description: "Lists the current tenant's recent bulk-update jobs. This canonical history backs the recipient result UI; realtime only prompts a refetch."
      responses:
        '200':
          description: Tenant-scoped bulk job history
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/BulkJob'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
    post:
      operationId: createBulkJob
      description: 'M2-S4 / BR-GEN-005, BR-CF-004/005/006/007, BR-REC-009: resolves and freezes an explicit recipient selection before queuing the bulk operation.'
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BulkJobCreateRequest'}
      responses:
        '202':
          description: Bulk job accepted
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BulkJob'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /bulk-jobs/preview:
    post:
      operationId: previewBulkJob
      description: 'BR-CF-004 authoritative dry-run: validates the action and returns the resolved selected-recipient scope without creating a job or checkpoint.'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BulkJobCreateRequest'}
      responses:
        '200':
          description: Validated bulk scope estimate
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BulkJobPreview'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /bulk-jobs/{bulkJobId}:
    get:
      operationId: getBulkJob
      parameters:
        - {$ref: '#/components/parameters/BulkJobId'}
      responses:
        '200':
          description: Bulk job
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BulkJob'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /bulk-jobs/{bulkJobId}/error-file:
    get:
      operationId: downloadBulkErrorFile
      description: 'Downloads failed bulk-update recipient checkpoints with a machine-readable error reason. The job remains tenant-scoped.'
      parameters:
        - {$ref: '#/components/parameters/BulkJobId'}
      responses:
        '200':
          description: CSV file of failed recipient checkpoints; header-only when the job has no failures.
          content:
            text/csv:
              schema: {type: string, format: binary}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /bulk-jobs/{bulkJobId}/result-file:
    get:
      operationId: downloadBulkResultFile
      description: 'Downloads the tenant-scoped CSV result for a completed bulk export. Other bulk job types do not expose this artifact.'
      parameters:
        - {$ref: '#/components/parameters/BulkJobId'}
      responses:
        '200':
          description: CSV file containing the successful frozen recipient checkpoints for the export.
          content:
            text/csv:
              schema: {type: string, format: binary}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /webhooks/providers/{provider}:
    post:
      security: []
      operationId: ingestProviderWebhook
      description: >-
        M5-S4 (BR-SEND-008). No session on this route -- the request is
        authenticated by its HMAC signature (X-EOW-Signature), verified
        server-side, never by hiding the URL (same security: [] declaration
        /auth/login uses). The tenant and recipient are resolved server-side
        from the payload's own Message-ID, never trusted from the request
        body. 400 is a malformed signature header or a payload missing a
        required field; 401 is a signature that is forged, tampered, or
        expired outside the tolerance window; 404 is an unrecognized
        provider; 413 is a body over the 1 MiB webhook size limit; 503 means
        the signing secret is not configured for this deployment, which
        never falls back to accepting an unverified event.
      parameters:
        - {name: provider, in: path, required: true, schema: {enum: [smtp]}}
        - name: X-EOW-Signature
          in: header
          required: true
          schema: {type: string}
          description: 't=<unix seconds>,v1=<hex hmac-sha256 of "<t>.<raw body>">'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProviderWebhookPayload'}
      responses:
        '200':
          description: 'Event handled: applied, a duplicate replay, ignored (stale or an illegal transition), or unmatched to any known message.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProviderWebhookResult'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '413': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /dead-letter-events:
    get:
      operationId: listDeadLetterEvents
      parameters: [{name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}, {name: cursor, in: query, schema: {type: string, format: uuid}}]
      responses: {'200': {description: Tenant-scoped dead-letter page, content: {application/json: {schema: {$ref: '#/components/schemas/DeadLetterEventListResponse'}}}}, '403': {$ref: '#/components/responses/Problem'}}
  /dead-letter-events/{deadLetterEventId}:
    get:
      operationId: getDeadLetterEvent
      parameters: [{$ref: '#/components/parameters/DeadLetterEventId'}]
      responses: {'200': {description: Tenant-scoped dead-letter event, content: {application/json: {schema: {$ref: '#/components/schemas/DeadLetterEvent'}}}}, '403': {$ref: '#/components/responses/Problem'}, '404': {$ref: '#/components/responses/Problem'}}
  /dead-letter-events/{deadLetterEventId}/replay:
    post:
      operationId: replayDeadLetterEvent
      parameters: [{$ref: '#/components/parameters/DeadLetterEventId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      responses: {'202': {description: Dead-letter source restored to the authoritative relay, content: {application/json: {schema: {type: object, required: [id, enqueued, replayCount], properties: {id: {type: string, format: uuid}, enqueued: {type: boolean}, replayCount: {type: integer, minimum: 0}}}}}}, '400': {$ref: '#/components/responses/Problem'}, '403': {$ref: '#/components/responses/Problem'}, '404': {$ref: '#/components/responses/Problem'}, '409': {$ref: '#/components/responses/Problem'}}
components:
  securitySchemes:
    sessionCookie: {type: apiKey, in: cookie, name: eow_session}
  parameters:
    CampaignId: {name: campaignId, in: path, required: true, schema: {type: string, format: uuid}}
    IfMatch: {name: If-Match, in: header, required: true, schema: {type: string}, description: 'Strong ETag from the most recent campaign response. Missing precondition returns 428.'}
    TemplateId: {name: templateId, in: path, required: true, schema: {type: string, format: uuid}}
    TemplateVersionId: {name: templateVersionId, in: path, required: true, schema: {type: string, format: uuid}}
    RecipientId: {name: recipientId, in: path, required: true, schema: {type: string, format: uuid}}
    RecipientListId: {name: recipientListId, in: path, required: true, schema: {type: string, format: uuid}}
    TagId: {name: tagId, in: path, required: true, schema: {type: string, format: uuid}}
    CustomFieldId: {name: customFieldId, in: path, required: true, schema: {type: string, format: uuid}}
    ConfiguredVariableId: {name: configuredVariableId, in: path, required: true, schema: {type: string, format: uuid}}
    AssetId: {name: assetId, in: path, required: true, schema: {type: string, format: uuid}}
    ReusableBlockId: {name: reusableBlockId, in: path, required: true, schema: {type: string, format: uuid}}
    ImportJobId: {name: importJobId, in: path, required: true, schema: {type: string, format: uuid}}
    BulkJobId: {name: bulkJobId, in: path, required: true, schema: {type: string, format: uuid}}
    SenderConfigId: {name: senderConfigId, in: path, required: true, schema: {type: string, format: uuid}}
    DeadLetterEventId: {name: deadLetterEventId, in: path, required: true, schema: {type: string, format: uuid}}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 1, maxLength: 255}
      description: 'Required by BR-GEN-005 so every import/bulk job creation is retry-safe.'
    SegmentSearch: {name: search, in: query, required: false, schema: {type: string, maxLength: 200}}
    SegmentCursor: {name: cursor, in: query, required: false, schema: {type: string}}
    SegmentLimit: {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100, default: 25}}
  headers:
    CampaignETag: {description: 'Strong quoted campaign version for optimistic concurrency.', schema: {type: string, pattern: '^"[0-9]+"$'}}
  schemas:
    DeadLetterEvent:
      type: object
      required: [id, source, eventId, eventType, aggregateType, aggregateId, payload, attempts, lastError, deadLetteredAt, replayedAt, replayCount]
      properties:
        id: {type: string, format: uuid}
        source: {type: string, enum: [outbox, job]}
        eventId: {type: [string, 'null'], format: uuid}
        eventType: {type: string}
        aggregateType: {type: [string, 'null']}
        aggregateId: {type: [string, 'null'], format: uuid}
        payload: {type: object, additionalProperties: true}
        attempts: {type: integer, minimum: 0}
        lastError: {type: [string, 'null']}
        deadLetteredAt: {type: string, format: date-time}
        replayedAt: {type: [string, 'null'], format: date-time}
        replayCount: {type: integer, minimum: 0}
    DeadLetterEventListResponse:
      type: object
      required: [items, nextCursor]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/DeadLetterEvent'}}
        nextCursor: {type: [string, 'null'], format: uuid}
    ReadinessCheck:
      type: object
      required: [ok, latencyMs]
      properties:
        ok: {type: boolean}
        latencyMs: {type: integer, minimum: 0}
    ReadinessResponse:
      type: object
      required: [status, checks]
      properties:
        status: {type: string, enum: [ready, unready]}
        checks:
          type: object
          required: [database, redis]
          properties:
            database: {$ref: '#/components/schemas/ReadinessCheck'}
            redis: {$ref: '#/components/schemas/ReadinessCheck'}
    SenderConfig:
      type: object
      required: [id, name, fromName, fromEmail, replyTo, provider, host, port, username, secretRef, credentialConfigured, status, verifiedAt, lastTestedAt, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        fromName: {type: string}
        fromEmail: {type: string, format: email}
        replyTo: {type: [string, 'null'], format: email}
        provider: {type: string, enum: [smtp]}
        host: {type: string}
        port: {type: integer, minimum: 1, maximum: 65535}
        username: {type: string}
        secretRef: {type: string, description: 'Masked reference only; plaintext secret is never returned.'}
        credentialConfigured: {type: boolean, description: 'True when the API and worker can resolve a durable encrypted credential or an explicit legacy environment reference.'}
        status: {type: string, enum: [pending, verified, failed, disabled]}
        verifiedAt: {type: [string, 'null'], format: date-time}
        lastTestedAt: {type: [string, 'null'], format: date-time}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    SenderConfigListResponse:
      type: object
