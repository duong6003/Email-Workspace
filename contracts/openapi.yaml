openapi: 3.1.0
info:
  title: Email Operations Workspace API
  version: 1.0.0
servers:
  - url: /api/v1
security:
  - sessionCookie: []
paths:
  /sender-configs:
    get:
      operationId: listSenderConfigs
      parameters:
        - {name: usable, in: query, required: false, description: 'When true, returns verified active senders suitable for compose. Content users are restricted to this view.', schema: {type: boolean, default: false}}
      responses: {'200': {description: Sender configurations, content: {application/json: {schema: {$ref: '#/components/schemas/SenderConfigListResponse'}}}}, '403': {$ref: '#/components/responses/Problem'}}
    post:
      operationId: createSenderConfig
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SenderConfigCreateRequest'}}}}
      responses: {'201': {description: Sender configuration, content: {application/json: {schema: {$ref: '#/components/schemas/SenderConfig'}}}}, '400': {$ref: '#/components/responses/Problem'}, '403': {$ref: '#/components/responses/Problem'}}
  /sender-configs/{senderConfigId}:
    get:
      operationId: getSenderConfig
      parameters: [{$ref: '#/components/parameters/SenderConfigId'}]
      responses: {'200': {description: Sender configuration, content: {application/json: {schema: {$ref: '#/components/schemas/SenderConfig'}}}}, '403': {$ref: '#/components/responses/Problem'}, '404': {$ref: '#/components/responses/Problem'}}
    patch:
      operationId: updateSenderConfig
      parameters: [{$ref: '#/components/parameters/SenderConfigId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SenderConfigUpdateRequest'}}}}
      responses: {'200': {description: Updated sender configuration, content: {application/json: {schema: {$ref: '#/components/schemas/SenderConfig'}}}}, '403': {$ref: '#/components/responses/Problem'}}
    delete:
      operationId: disableSenderConfig
      parameters: [{$ref: '#/components/parameters/SenderConfigId'}]
      responses: {'204': {description: Sender disabled; history preserved}, '403': {$ref: '#/components/responses/Problem'}}
  /sender-configs/{senderConfigId}/test-connection:
    post:
      operationId: testSenderConnection
      parameters: [{$ref: '#/components/parameters/SenderConfigId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: false, content: {application/json: {schema: {type: object, properties: {secret: {type: string, writeOnly: true}}}}}}
      responses: {'200': {description: 'Connection, authentication and sender-envelope probe result. A successful probe sends one test message to the configured from address.'}, '400': {$ref: '#/components/responses/Problem'}, '403': {$ref: '#/components/responses/Problem'}}
  /sending-policy:
    get:
      operationId: getSendingPolicy
      responses: {'200': {description: Sending policy, content: {application/json: {schema: {$ref: '#/components/schemas/SendingPolicy'}}}}, '403': {$ref: '#/components/responses/Problem'}}
    put:
      operationId: updateSendingPolicy
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SendingPolicyUpdateRequest'}}}}
      responses: {'200': {description: Updated sending policy, content: {application/json: {schema: {$ref: '#/components/schemas/SendingPolicy'}}}}, '403': {$ref: '#/components/responses/Problem'}}
  /global-variables:
    get:
      operationId: listGlobalVariables
      responses: {'200': {description: Tenant-global configured variables, content: {application/json: {schema: {$ref: '#/components/schemas/ConfiguredVariableListResponse'}}}}, '403': {$ref: '#/components/responses/Problem'}}
    post:
      operationId: createGlobalVariable
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/GlobalVariableCreateRequest'}}}}
      responses: {'201': {description: Global variable created, content: {application/json: {schema: {$ref: '#/components/schemas/ConfiguredVariable'}}}}, '400': {$ref: '#/components/responses/Problem'}, '403': {$ref: '#/components/responses/Problem'}, '409': {$ref: '#/components/responses/Problem'}, '422': {$ref: '#/components/responses/Problem'}}
  /global-variables/{configuredVariableId}:
    patch:
      operationId: updateGlobalVariable
      parameters: [{$ref: '#/components/parameters/ConfiguredVariableId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/GlobalVariableUpdateRequest'}}}}
      responses: {'200': {description: Global variable updated, content: {application/json: {schema: {$ref: '#/components/schemas/ConfiguredVariable'}}}}, '403': {$ref: '#/components/responses/Problem'}, '404': {$ref: '#/components/responses/Problem'}, '409': {$ref: '#/components/responses/Problem'}}
    delete:
      operationId: deleteGlobalVariable
      parameters: [{$ref: '#/components/parameters/ConfiguredVariableId'}]
      responses: {'204': {description: Global variable deleted when no published version references it}, '403': {$ref: '#/components/responses/Problem'}, '404': {$ref: '#/components/responses/Problem'}, '409': {$ref: '#/components/responses/Problem'}}
  /assets:
    get:
      operationId: listAssets
      description: >-
        MC-UI-005. The tenant's live asset library, newest first. Archived assets
        are omitted here and still served by getAssetFile -- archiving hides an
        image from the library, it does not withdraw it from email already sent
        (ADR-043 §5).
      responses: {'200': {description: Live assets in the tenant, content: {application/json: {schema: {$ref: '#/components/schemas/AssetListResponse'}}}}, '403': {$ref: '#/components/responses/Problem'}}
    post:
      operationId: uploadAsset
      description: >-
        Multipart, one file per request. The stored content type is decided by
        magic bytes and the declared Content-Type is not read at all (ADR-043 §4).
        415 carries the specific refusal in `code`: SVG_REJECTED for an SVG, which
        can carry script and would be served from our own origin, or
        UNSUPPORTED_TYPE for anything that is not PNG, JPEG, GIF or WebP. 413 is
        the 5 MB cap, the same number as the template HTML cap.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, format: binary}
                kind:
                  enum: [logo, image]
                  description: >-
                    Optional. Absent, or present and empty, means image -- an
                    upload that says nothing about the file is ordinary, and
                    refusing it would fail over a control nobody touched. A
                    value that is present and is neither of the two is a 400,
                    not a silent default: filing an asset somewhere the caller
                    did not ask for, without telling them, is worse than a
                    refusal.
      responses: {'201': {description: Asset stored, content: {application/json: {schema: {$ref: '#/components/schemas/Asset'}}}}, '400': {$ref: '#/components/responses/Problem'}, '403': {$ref: '#/components/responses/Problem'}, '413': {$ref: '#/components/responses/Problem'}, '415': {$ref: '#/components/responses/Problem'}}
  /assets/{assetId}/replace:
    post:
      operationId: replaceAsset
      description: >-
        Uploads a new asset and archives the named one, returning the new asset
        with a new id and a new URL. It never overwrites the stored bytes: the old
        URL is frozen inside published versions that cannot be edited, so
        overwriting would change the image inside email already approved
        (ADR-043 §7). 201, not 200, because the result is a new resource.
      parameters: [{$ref: '#/components/parameters/AssetId'}]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: {type: object, required: [file], properties: {file: {type: string, format: binary}}}
      responses: {'201': {description: New asset stored and the previous one archived, content: {application/json: {schema: {$ref: '#/components/schemas/Asset'}}}}, '400': {$ref: '#/components/responses/Problem'}, '403': {$ref: '#/components/responses/Problem'}, '404': {$ref: '#/components/responses/Problem'}, '413': {$ref: '#/components/responses/Problem'}, '415': {$ref: '#/components/responses/Problem'}}
  /assets/{assetId}:
    patch:
      operationId: updateAsset
      description: >-
        Changes the caller-chosen classification of an existing asset (ADR-044
        Task SV-4). Separate from replaceAsset, which mints new bytes and a new
        id: this one changes nothing a published email points at, so it is a
        plain update rather than the archive-and-recreate dance ADR-043 §7
        requires of content changes. Nothing else about an asset is mutable.
      parameters: [{$ref: '#/components/parameters/AssetId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateAssetRequest'}
      responses: {'200': {description: The updated asset, content: {application/json: {schema: {$ref: '#/components/schemas/Asset'}}}}, '400': {$ref: '#/components/responses/Problem'}, '403': {$ref: '#/components/responses/Problem'}, '404': {$ref: '#/components/responses/Problem'}}
    delete:
      operationId: archiveAsset
      description: >-
        Archives; nothing is ever hard-deleted (ADR-043 §5), and the database does
        not grant the runtime role DELETE on this table at all. The asset leaves
        the library and keeps being served, because a published version still
        points at it and cannot be edited.
      parameters: [{$ref: '#/components/parameters/AssetId'}]
      responses: {'204': {description: Asset archived; the object and its public URL are untouched}, '403': {$ref: '#/components/responses/Problem'}, '404': {$ref: '#/components/responses/Problem'}}
  /assets/{assetId}/{filename}:
    get:
      security: []
      operationId: getAssetFile
      description: >-
        The URL embedded in email HTML, and the first public route in this API to
        serve user data. No session: the fetch comes from a recipient's mail
        client and carries none of our cookies (same security: [] declaration
        /auth/login uses). The asset id is therefore a bearer capability -- anyone
        holding the link can fetch the image -- which is why the asset store is
        not a place for sensitive files and the upload UI says so (ADR-043 §2).

        `filename` is never read. It exists so the URL ends in something readable
        and mail clients infer a sane name. Nothing here accepts a path or a
        storage key: the key is derived from the row the id resolves to, so there
        is no traversal surface. A malformed id answers 404 rather than 400 --
        one fewer signal for a prober.
      parameters:
        - {$ref: '#/components/parameters/AssetId'}
        - {name: filename, in: path, required: true, description: Display name only; never consulted., schema: {type: string}}
      responses:
        '200':
          description: The stored image bytes, with the sniffed content type and a long immutable Cache-Control. Archived assets are served too.
          content:
            image/png: {schema: {type: string, format: binary}}
            image/jpeg: {schema: {type: string, format: binary}}
            image/gif: {schema: {type: string, format: binary}}
            image/webp: {schema: {type: string, format: binary}}
        '404': {description: No such asset, no stored object, or an id that is not a UUID.}
  /reusable-blocks:
    get:
      operationId: listReusableBlocks
      description: >-
        MC-UI-004. Blocks belong to the tenant, not to whoever saved them, so this is
        one list for everyone with content:read -- there is no per-user partition.
        `node` is omitted here and returned only by getReusableBlock, the same
        projection the template library uses (ADR-035).
      responses: {'200': {description: Reusable blocks in the tenant, content: {application/json: {schema: {$ref: '#/components/schemas/ReusableBlockListResponse'}}}}, '403': {$ref: '#/components/responses/Problem'}}
    post:
      operationId: createReusableBlock
      description: Saves the selected node subtree. Name is unique per tenant; a normalized duplicate is 409 REUSABLE_BLOCK_NAME_CONFLICT.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ReusableBlockCreateRequest'}}}}
      responses: {'201': {description: Reusable block saved, content: {application/json: {schema: {$ref: '#/components/schemas/ReusableBlock'}}}}, '400': {$ref: '#/components/responses/Problem'}, '403': {$ref: '#/components/responses/Problem'}, '409': {$ref: '#/components/responses/Problem'}}
  /reusable-blocks/{reusableBlockId}:
    get:
      operationId: getReusableBlock
      description: The block with its `node` subtree, fetched at the moment it is inserted rather than for every row of the list.
      parameters: [{$ref: '#/components/parameters/ReusableBlockId'}]
      responses: {'200': {description: Reusable block, content: {application/json: {schema: {$ref: '#/components/schemas/ReusableBlock'}}}}, '403': {$ref: '#/components/responses/Problem'}, '404': {$ref: '#/components/responses/Problem'}}
    patch:
      operationId: renameReusableBlock
      description: >-
        Rename only; the saved tree is immutable. Any caller with content:manage may
        rename any block in the tenant, including one they did not save -- that is
        what tenant ownership means. `createdBy` is never reassigned.
      parameters: [{$ref: '#/components/parameters/ReusableBlockId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ReusableBlockRenameRequest'}}}}
      responses: {'200': {description: Reusable block renamed, content: {application/json: {schema: {$ref: '#/components/schemas/ReusableBlock'}}}}, '400': {$ref: '#/components/responses/Problem'}, '403': {$ref: '#/components/responses/Problem'}, '404': {$ref: '#/components/responses/Problem'}, '409': {$ref: '#/components/responses/Problem'}}
    delete:
      operationId: deleteReusableBlock
      description: >-
        Hard delete, and safe: inserting a block copies its subtree into the document,
        so every template that used it owns its own copy and nothing is left dangling
        -- unlike an asset, which a published version still points at.
      parameters: [{$ref: '#/components/parameters/ReusableBlockId'}]
      responses: {'204': {description: Reusable block deleted}, '403': {$ref: '#/components/responses/Problem'}, '404': {$ref: '#/components/responses/Problem'}}
  /sending-quota:
    get:
      operationId: getSendingQuota
      responses: {'200': {description: Sending quota configuration, content: {application/json: {schema: {$ref: '#/components/schemas/SendingQuota'}}}}, '403': {$ref: '#/components/responses/Problem'}}
    put:
      operationId: putSendingQuota
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SendingQuotaUpdateRequest'}}}}
      responses: {'200': {description: Updated sending quota configuration, content: {application/json: {schema: {$ref: '#/components/schemas/SendingQuota'}}}}, '400': {$ref: '#/components/responses/Problem'}, '403': {$ref: '#/components/responses/Problem'}}
  /sending-quota/usage:
    get:
      operationId: getSendingQuotaUsage
      responses: {'200': {description: Current sending quota usage, content: {application/json: {schema: {$ref: '#/components/schemas/SendingQuotaUsage'}}}}, '403': {$ref: '#/components/responses/Problem'}}
  /retention-policy:
    get:
      operationId: getRetentionPolicy
      responses: {'200': {description: Retention policy, content: {application/json: {schema: {$ref: '#/components/schemas/RetentionPolicy'}}}}, '403': {$ref: '#/components/responses/Problem'}}
    put:
      operationId: updateRetentionPolicy
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RetentionPolicyUpdateRequest'}}}}
      responses: {'200': {description: Updated retention policy, content: {application/json: {schema: {$ref: '#/components/schemas/RetentionPolicy'}}}}, '400': {$ref: '#/components/responses/Problem'}, '403': {$ref: '#/components/responses/Problem'}}
  /health:
    get:
      security: []
      operationId: health
      responses: {'200': {description: Ready}}
  /health/ready:
    get:
      security: []
      operationId: getReadiness
      responses:
        '200': {description: PostgreSQL and Redis are reachable, content: {application/json: {schema: {$ref: '#/components/schemas/ReadinessResponse'}}}}
        '503': {description: At least one required dependency is unavailable, content: {application/json: {schema: {$ref: '#/components/schemas/ReadinessResponse'}}}}
  /templates:
    get:
      operationId: listTemplates
      parameters:
        - {name: search, in: query, schema: {type: string, maxLength: 160}}
        - {name: status, in: query, schema: {type: string, enum: [draft, published]}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
      responses: {'200': {description: Template library, content: {application/json: {schema: {$ref: '#/components/schemas/TemplateListResponse'}}}}, '403': {$ref: '#/components/responses/Problem'}}
    post:
      operationId: createTemplate
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TemplateCreateRequest'}}}}
      responses: {'201': {description: Draft created, headers: {ETag: {$ref: '#/components/headers/CampaignETag'}}, content: {application/json: {schema: {$ref: '#/components/schemas/Template'}}}}, '400': {$ref: '#/components/responses/Problem'}, '403': {$ref: '#/components/responses/Problem'}, '409': {$ref: '#/components/responses/Problem'}, '422': {$ref: '#/components/responses/Problem'}}
  /templates/analyze:
    post:
      operationId: analyzeTemplateDraft
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TemplateAnalyzeRequest'}}}}
      responses: {'201': {description: Side-effect-free sanitize and variable preflight, content: {application/json: {schema: {$ref: '#/components/schemas/TemplateAnalysis'}}}}, '400': {$ref: '#/components/responses/Problem'}, '403': {$ref: '#/components/responses/Problem'}, '422': {$ref: '#/components/responses/Problem'}}
  /templates/{templateId}:
    get:
      operationId: getTemplate
      parameters: [{$ref: '#/components/parameters/TemplateId'}]
      responses: {'200': {description: Template draft, headers: {ETag: {$ref: '#/components/headers/CampaignETag'}}, content: {application/json: {schema: {$ref: '#/components/schemas/Template'}}}}, '403': {$ref: '#/components/responses/Problem'}, '404': {$ref: '#/components/responses/Problem'}}
    patch:
      operationId: updateTemplate
      parameters:
        - {$ref: '#/components/parameters/TemplateId'}
        - {$ref: '#/components/parameters/IfMatch'}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TemplateUpdateRequest'}}}}
      responses: {'200': {description: Draft updated, headers: {ETag: {$ref: '#/components/headers/CampaignETag'}}, content: {application/json: {schema: {$ref: '#/components/schemas/Template'}}}}, '400': {$ref: '#/components/responses/Problem'}, '403': {$ref: '#/components/responses/Problem'}, '404': {$ref: '#/components/responses/Problem'}, '409': {$ref: '#/components/responses/Problem'}, '412': {$ref: '#/components/responses/Problem'}, '422': {$ref: '#/components/responses/Problem'}, '428': {$ref: '#/components/responses/Problem'}}
    delete:
      operationId: archiveTemplate
      parameters: [{$ref: '#/components/parameters/TemplateId'}]
      responses: {'204': {description: Soft archived; versions remain readable}, '403': {$ref: '#/components/responses/Problem'}, '404': {$ref: '#/components/responses/Problem'}}
  /templates/{templateId}/publish:
    post:
      operationId: publishTemplate
      parameters: [{$ref: '#/components/parameters/TemplateId'}]
      responses: {'201': {description: Immutable version published, content: {application/json: {schema: {$ref: '#/components/schemas/TemplateVersion'}}}}, '403': {$ref: '#/components/responses/Problem'}, '404': {$ref: '#/components/responses/Problem'}, '409': {$ref: '#/components/responses/Problem'}, '422': {$ref: '#/components/responses/Problem'}}
  /templates/{templateId}/versions:
    get:
      operationId: listTemplateVersions
      parameters: [{$ref: '#/components/parameters/TemplateId'}]
      responses: {'200': {description: Published versions newest first, metadata only, content: {application/json: {schema: {type: object, required: [items], properties: {items: {type: array, items: {$ref: '#/components/schemas/TemplateVersionSummary'}}}}}}}, '403': {$ref: '#/components/responses/Problem'}, '404': {$ref: '#/components/responses/Problem'}}
  /templates/{templateId}/versions/{templateVersionId}/restore:
    post:
      operationId: restoreTemplateVersion
      parameters: [{$ref: '#/components/parameters/TemplateId'}, {$ref: '#/components/parameters/TemplateVersionId'}, {$ref: '#/components/parameters/IfMatch'}]
      responses: {'200': {description: Version content copied into the draft; the version itself is unchanged, headers: {ETag: {$ref: '#/components/headers/CampaignETag'}}, content: {application/json: {schema: {$ref: '#/components/schemas/Template'}}}}, '400': {$ref: '#/components/responses/Problem'}, '403': {$ref: '#/components/responses/Problem'}, '404': {$ref: '#/components/responses/Problem'}, '412': {$ref: '#/components/responses/Problem'}, '428': {$ref: '#/components/responses/Problem'}}
  /templates/{templateId}/preview:
    post:
      operationId: previewTemplateDraft
      parameters: [{$ref: '#/components/parameters/TemplateId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TemplateMergeRequest'}}}}
      responses: {'201': {description: Lenient render of current sanitized draft content, content: {application/json: {schema: {$ref: '#/components/schemas/TemplatePreview'}}}}, '400': {$ref: '#/components/responses/Problem'}, '403': {$ref: '#/components/responses/Problem'}, '404': {$ref: '#/components/responses/Problem'}, '422': {$ref: '#/components/responses/Problem'}}
  /templates/{templateId}/variables:
    get:
      operationId: listTemplateVariables
      parameters: [{$ref: '#/components/parameters/TemplateId'}]
      responses: {'200': {description: Template-owned draft variable definitions, content: {application/json: {schema: {$ref: '#/components/schemas/ConfiguredVariableListResponse'}}}}, '403': {$ref: '#/components/responses/Problem'}, '404': {$ref: '#/components/responses/Problem'}}
    post:
      operationId: createTemplateVariable
      parameters: [{$ref: '#/components/parameters/TemplateId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TemplateVariableCreateRequest'}}}}
      responses: {'201': {description: Template variable created, content: {application/json: {schema: {$ref: '#/components/schemas/ConfiguredVariable'}}}}, '400': {$ref: '#/components/responses/Problem'}, '403': {$ref: '#/components/responses/Problem'}, '404': {$ref: '#/components/responses/Problem'}, '409': {$ref: '#/components/responses/Problem'}, '422': {$ref: '#/components/responses/Problem'}}
  /template-variables/{configuredVariableId}:
    patch:
      operationId: updateTemplateVariable
      parameters: [{$ref: '#/components/parameters/ConfiguredVariableId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TemplateVariableUpdateRequest'}}}}
      responses: {'200': {description: Template variable updated, content: {application/json: {schema: {$ref: '#/components/schemas/ConfiguredVariable'}}}}, '403': {$ref: '#/components/responses/Problem'}, '404': {$ref: '#/components/responses/Problem'}}
    delete:
      operationId: deleteTemplateVariable
      parameters: [{$ref: '#/components/parameters/ConfiguredVariableId'}]
      responses: {'204': {description: Template variable deleted when no published version references it}, '403': {$ref: '#/components/responses/Problem'}, '404': {$ref: '#/components/responses/Problem'}, '409': {$ref: '#/components/responses/Problem'}}
  /template-versions/{templateVersionId}:
    get:
      operationId: getTemplateVersion
      parameters: [{$ref: '#/components/parameters/TemplateVersionId'}]
      responses: {'200': {description: Immutable published version, content: {application/json: {schema: {$ref: '#/components/schemas/TemplateVersion'}}}}, '403': {$ref: '#/components/responses/Problem'}, '404': {$ref: '#/components/responses/Problem'}}
    patch:
      operationId: rejectTemplateVersionPatch
      parameters: [{$ref: '#/components/parameters/TemplateVersionId'}]
      responses: {'405': {description: Published versions are immutable}, '403': {$ref: '#/components/responses/Problem'}}
    delete:
      operationId: rejectTemplateVersionDelete
      parameters: [{$ref: '#/components/parameters/TemplateVersionId'}]
      responses: {'405': {description: Published versions are immutable}, '403': {$ref: '#/components/responses/Problem'}}
  /template-versions/{templateVersionId}/preview:
    post:
      operationId: previewTemplateVersion
      parameters: [{$ref: '#/components/parameters/TemplateVersionId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TemplateMergeRequest'}}}}
      responses: {'201': {description: Lenient render of immutable version data, content: {application/json: {schema: {$ref: '#/components/schemas/TemplatePreview'}}}}, '400': {$ref: '#/components/responses/Problem'}, '403': {$ref: '#/components/responses/Problem'}, '404': {$ref: '#/components/responses/Problem'}}
  /template-versions/{templateVersionId}/test-send:
    post:
      operationId: sendTemplateVersionTest
      parameters: [{$ref: '#/components/parameters/TemplateVersionId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TemplateMergeRequest'}}}}
      responses: {'201': {description: Test email delivered only to the authenticated actor, content: {application/json: {schema: {$ref: '#/components/schemas/TemplateTestSend'}}}}, '400': {$ref: '#/components/responses/Problem'}, '403': {$ref: '#/components/responses/Problem'}, '404': {$ref: '#/components/responses/Problem'}, '409': {$ref: '#/components/responses/Problem'}, '422': {$ref: '#/components/responses/Problem'}}
  /auth/login:
    post:
      security: []
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
      responses:
        '204': {description: Authenticated; session cookie set}
        '401': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
  /auth/refresh:
    post:
      operationId: refreshSession
      responses:
        '204': {description: Session rotated; new cookie set}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /auth/logout:
    post:
      operationId: logout
      responses:
        '204': {description: Session revoked}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /auth/me:
    get:
      operationId: getCurrentUser
      responses:
        '200':
          description: Authenticated user profile
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Me'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /auth/forgot-password:
    post:
      security: []
      operationId: forgotPassword
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ForgotPasswordRequest'}
      responses:
        '202': {description: 'Recovery email sent if the address is registered (response is identical either way to avoid account enumeration)'}
  /auth/reset-password:
    post:
      security: []
      operationId: resetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ResetPasswordRequest'}
      responses:
        '204': {description: 'Password changed; all existing sessions for the user are revoked'}
        '401': {$ref: '#/components/responses/Problem'}
  /recipients:
    get:
      operationId: listRecipients
      description: 'BR-REC-007/008 and BR-SEG-007: search plus status/list/tag filters, server-side cursor pagination, tenant-scoped.'
      parameters:
        - {name: search, in: query, required: false, schema: {type: string}}
        - {name: status, in: query, required: false, schema: {type: array, items: {$ref: '#/components/schemas/RecipientStatus'}}, style: form, explode: true}
        - {name: listIds, in: query, required: false, schema: {type: array, items: {type: string, format: uuid}}, style: form, explode: true}
        - {name: tagIds, in: query, required: false, schema: {type: array, items: {type: string, format: uuid}}, style: form, explode: true}
        - {name: cursor, in: query, required: false, schema: {type: string}}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100, default: 25}}
      responses:
        '200':
          description: Page of recipients
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RecipientListResponse'}
        '403': {$ref: '#/components/responses/Problem'}
    post:
      operationId: createRecipient
      description: 'BR-REC-001: duplicate email (case/whitespace-insensitive) within the tenant returns 409 with the existing recipient''s id.'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RecipientCreateRequest'}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Recipient'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
  /recipients/{recipientId}:
    get:
      operationId: getRecipient
      parameters:
        - {$ref: '#/components/parameters/RecipientId'}
      responses:
        '200':
          description: Recipient
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Recipient'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
    patch:
      operationId: updateRecipient
      description: 'BR-REC-004: an unsubscribed -> active transition is refused (403) unless the caller holds settings:manage and confirms confirmReconsent.'
      parameters:
        - {$ref: '#/components/parameters/RecipientId'}
