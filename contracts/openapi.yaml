          application/json:
            schema: {$ref: '#/components/schemas/RecipientUpdateRequest'}
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Recipient'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
    delete:
      operationId: deleteRecipient
      description: 'BR-GEN-006: soft delete only, never a hard DELETE. Row remains queryable for history/audit.'
      parameters:
        - {$ref: '#/components/parameters/RecipientId'}
      responses:
        '204': {description: Soft-deleted}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /recipient-lists:
    get:
      operationId: listRecipientLists
      description: 'BR-SEG-001/004/007/010: tenant-scoped reusable recipient lists with server-computed active-recipient counts.'
      parameters:
        - {$ref: '#/components/parameters/SegmentSearch'}
        - {$ref: '#/components/parameters/SegmentCursor'}
        - {$ref: '#/components/parameters/SegmentLimit'}
      responses:
        '200':
          description: Stable name/id ordered page of recipient lists
