          application/json:
            schema: {$ref: '#/components/schemas/RecipientListCreateRequest'}
      responses:
        '201':
          description: Recipient list created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RecipientList'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /recipient-lists/{recipientListId}:
    get:
      operationId: getRecipientList
      parameters: [{$ref: '#/components/parameters/RecipientListId'}]
      responses:
        '200':
          description: Recipient list
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RecipientList'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
    patch:
      operationId: updateRecipientList
      parameters: [{$ref: '#/components/parameters/RecipientListId'}]
