# ADR-043: the asset serving route is @Public() -- the fetch comes from a
# recipient's mail client and carries none of our cookies -- so it is the first
# public route that streams user data. Rate limiting belongs here rather than in
# the API: this is the edge that already sees every request, and an app-level
# limiter would be counting requests that have already cost a proxy hop and a
# database lookup. 30r/s with a burst absorbs a mail client fetching every image
# in one message at once, while capping a scraper hammering one known URL.
limit_req_zone $binary_remote_addr zone=eow_assets:10m rate=30r/s;

server {
  listen 8080;
  server_name _;
  server_tokens off;
  # Match apps/api's bounded JSON-preview contract so the API owns RFC 9457
  # error formatting instead of Nginx returning its default HTML 413 page.
  client_max_body_size 18m;

  # Docker replaces a service container during `compose up --build`. Resolve the
  # upstream per request so Nginx does not keep proxying a retired API IP.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_upstream api:3000;

  location = /healthz {
    # Edge liveness only: this proves Nginx is serving independently of API readiness.
    access_log off;
    add_header Content-Type text/plain;
    return 200 'ok';
  }

  # More specific than /api/ below, so Nginx picks this for asset fetches.
  #
  # No trailing slash on the pattern -- ARCH-NGINX-ROUTING (found 2026-09-03):
  # a pattern ending in `/` makes Nginx treat the bare path as a directory
  # missing its slash and answer 301 with a Location built from Nginx's OWN
  # scheme and port, never whatever a proxy or tunnel presented externally.
  # That redirect broke the upload/list route (`/api/v1/assets`, no further
  # segment) on every deployment, not just one behind https: a browser on an
  # https page treated the `http://` redirect target as mixed content and
  # failed outright. Dropping the slash still matches the file-serving path
  # (`/api/v1/assets/<id>/<file>`), which starts with the same prefix.
  location /api/v1/assets {
    limit_req zone=eow_assets burst=60 nodelay;
    limit_req_status 429;
    proxy_pass http://$api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/ {
    proxy_pass http://$api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /socket.io/ {
    proxy_pass http://$api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_read_timeout 65s;
  }

  location / {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /index.html;
  }
}
