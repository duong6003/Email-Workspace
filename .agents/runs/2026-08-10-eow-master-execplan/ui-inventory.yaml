  component: design-reference/ui-handoff-v2/source/app/action-overlays.tsx
  presentation_classes:
    small_modal: [sendSuccess, draftSaved, draftActions, recipientActions, templateActions,
                  configActions, setDefaultConfirm, deleteConfigConfirm, testConnection,
                  settingsSaved, resendConfirm, resendSuccess]
    large_modal: [recipientPicker, customVariableBuilder, composePreview, templateDetail,
                  mailConfigForm, editMailConfig, addRecipient]
    drawer: [historyDetail]
    popover: [notifications]
    command_palette: [command]
    standard_modal: [help, profile, sender, importExcel, templatePicker, importHtml, tagPicker,
                     manageTags, sendTest, sendConfirm, scheduleSend, bulkCustomData,
                     recipientFilter, createList, templateFilter, configFilter, historyFilter]
  catalog:
    - {id: command,               milestone: M1, rules: [BR-AUTH-004],                     notes: '⌘K palette; must respect RBAC when listing targets'}
    - {id: help,                  milestone: M1, rules: [BR-GEN-001]}
    - {id: profile,               milestone: M1, rules: [BR-AUTH-002, BR-AUTH-003],        api: [GET /auth/me, POST /auth/logout], notes: 'theme + sidebar prefs; logout clears server session, not localStorage'}
    - {id: notifications,         milestone: M6, rules: [BR-NOT-001, BR-NOT-004, BR-NOT-006, BR-NOT-010, BR-NOT-012], api: [GET /notifications, 'PUT /notifications/{id}/read'], events: [notification.created, notification.updated, notification.read], notes: 'mock `notificationItems` (3 literals) + local `readNotifications` state must become durable'}
    - {id: sender,                milestone: M5, rules: [BR-CFG-001, BR-CFG-004],          api: [GET /sender-accounts]}
    - {id: recipientPicker,       milestone: M4, rules: [BR-SEG-008, BR-SEG-009, BR-CMP-002], api: ['POST /campaigns/{id}/audience-preview'], notes: 'lists/tags/excel modes'}
    - {id: importExcel,           milestone: M2, rules: [BR-IMP-001, BR-IMP-002, BR-IMP-003, BR-IMP-004], api: [POST /recipients/imports], events: [import.progress, import.completed]}
    - {id: templatePicker,        milestone: M3, rules: [BR-TPL-001, BR-TPL-002],          api: [GET /templates]}
    - {id: importHtml,            milestone: M3, rules: [BR-TPL-006, BR-TPL-009],          api: [POST /templates]}
    - {id: tagPicker,             milestone: M2, rules: [BR-REC-006, BR-SEG-001],          api: [GET /tags]}
    - {id: manageTags,            milestone: M2, rules: [BR-SEG-002, BR-SEG-003, BR-SEG-006], api: [GET /tags, POST /tags, 'PATCH /tags/{id}', 'DELETE /tags/{id}']}
    - {id: customVariableBuilder, milestone: M2, rules: [BR-CF-001, BR-CF-002, BR-CF-003, BR-CF-005], api: [GET /custom-fields, POST /custom-fields], notes: 'actions/code dual mode'}
    - {id: sendTest,              milestone: M3, rules: [BR-TPL-011],                      api: ['POST /template-versions/{id}/test-send']}
    - {id: sendConfirm,           milestone: M4, rules: [BR-CMP-008, BR-CMP-009, BR-CMP-010, BR-CMP-005, BR-GEN-005], api: ['POST /campaigns/{id}/send'], notes: 'review-before-send; must block on missing required variables'}
    - {id: scheduleSend,          milestone: M5, rules: [BR-SCH-001, BR-SCH-002, BR-SCH-003, BR-SCH-004, BR-SCH-005, BR-SCH-006, BR-SCH-007, BR-SCH-008, BR-SCH-009, BR-SCH-010, BR-GEN-003], api: ['POST /campaigns/{id}/schedule', 'POST /campaigns/{id}/schedule/cancel'], events: [schedule.state_changed], notes: 'M5-S2: real zone list + local-time/UTC preview; DST/lead-time 422s as human copy with one-click fixes; ComposeDraftScreen gains a scheduled banner with a lock-window countdown'}
    - {id: sendSuccess,           milestone: M4, rules: [BR-NOT-001],                      notes: 'confirmation only; durable record lives in notification center'}
    - {id: draftSaved,            milestone: M4, rules: [BR-CMP-001]}
    - {id: draftActions,          milestone: M4, rules: [BR-CMP-011, BR-GEN-006]}
    - {id: composePreview,        milestone: M3, rules: [BR-TPL-005, BR-TPL-007, BR-TPL-012], api: ['POST /template-versions/{id}/preview'], notes: 'desktop/mobile device toggle + sample recipient switch'}
    - {id: addRecipient,          milestone: M2, rules: [BR-REC-001, BR-REC-002, BR-REC-003], api: [POST /recipients]}
    - {id: bulkCustomData,        milestone: M2, rules: [BR-CF-004, BR-CF-006, BR-CF-007, BR-CF-008, BR-CF-009], api: [POST /recipients/bulk-jobs], events: [bulk_update.progress, bulk_update.completed]}
    - {id: recipientFilter,       milestone: M2, rules: [BR-REC-008]}
    - {id: recipientActions,      milestone: M2, rules: [BR-REC-010, BR-GEN-006]}
    - {id: createList,            milestone: M2, rules: [BR-SEG-002, BR-SEG-005],          api: [POST /lists]}
    - {id: templateDetail,        milestone: M3, rules: [BR-TPL-002, BR-TPL-005, BR-TPL-012]}
    - {id: templateActions,       milestone: M3, rules: [BR-TPL-001, BR-TPL-010]}
    - {id: templateFilter,        milestone: M3, rules: [BR-TPL-001]}
    - {id: mailConfigForm,        milestone: M5, rules: [BR-CFG-001, BR-CFG-002, BR-SEC-001], notes: 'STOP-gate adjacent: never render or log stored SMTP credentials'}
    - {id: editMailConfig,        milestone: M5, rules: [BR-CFG-001, BR-CFG-002, BR-CFG-007, BR-SEC-001]}
    - {id: configActions,         milestone: M5, rules: [BR-CFG-007]}
    - {id: configFilter,          milestone: M5, rules: [BR-CFG-001]}
    - {id: setDefaultConfirm,     milestone: M5, rules: [BR-CFG-004]}
    - {id: deleteConfigConfirm,   milestone: M5, rules: [BR-CFG-007, BR-SCH-009], notes: 'must warn about scheduled campaigns bound to this sender'}
    - {id: testConnection,        milestone: M5, rules: [BR-CFG-003],                      api: ['POST /sender-accounts/{id}/test']}
    - {id: settingsSaved,         milestone: M5, rules: [BR-CFG-006]}
    - {id: historyFilter,         milestone: M6, rules: [BR-HIS-001]}
    - {id: historyDetail,         milestone: M6, rules: [BR-HIS-002, BR-HIS-003, BR-SEND-009, BR-SEND-010], notes: 'promote to route /history/:campaignId'}
    - {id: resendConfirm,         milestone: M6, rules: [BR-HIS-005, BR-CMP-010, BR-GEN-005]}
    - {id: resendSuccess,         milestone: M6, rules: [BR-NOT-001]}

# ---------------------------------------------------------------------------
# 5. Cross-cutting inventory
# ---------------------------------------------------------------------------

navigation:
  groups:
    - {label: null,        items: [{id: compose, label: Email, icon: compose}]}
    - {label: 'QUẢN LÝ',   items: [{id: recipients, label: 'Người nhận', icon: recipients},
                                   {id: templates,  label: 'Email template', icon: templates}]}
    - {label: 'HỆ THỐNG',  items: [{id: settings, label: 'Cấu hình email', icon: settings},
                                   {id: history,  label: 'Lịch sử gửi', icon: history}]}
  sub_navigation:
    email:      [compose, drafts]
    recipients: [all, lists, tags, imports]
    settings:   [configs, policy]

responsive:
  breakpoints_in_source: ['@media(max-width:1100px)', '@media(max-width:760px)']
  behavior:
    - {at: '<=1100px', change: 'compose-grid collapses to one column; context-panel moves below;
                                template-grid becomes 2 columns; profile text hidden; search 260px'}
    - {at: '<=760px',  change: 'app-shell drops the grid; sidebar becomes fixed 76px icon rail;
                                nav labels and sidebar footer hidden; collapse-button hidden'}
  acceptance_viewports:
    - {name: desktop, width: 1440, height: 900}
    - {name: tablet,  width: 768,  height: 1024}
    - {name: mobile,  width: 390,  height: 844}
  gap: >-
    The 768px acceptance viewport falls between the two source breakpoints and
    therefore renders the desktop grid at 768px. Tablet rendering must be captured
    as the handoff baseline and reproduced exactly; it must not be "fixed" during
    migration (that would be a redesign). Flag as a visual-verification observation.

required_states_matrix:
  contract: 'design-reference/ui-source-contract.yaml :: required_states'
  states: [loading, empty, error, success, permission_denied, reconnecting_when_realtime_applies]
  present_in_handoff: [success (toast + *Success overlays), error (login only)]
  absent_in_handoff: [loading, empty, permission_denied, reconnecting]
  consequence: >-
    Missing states are NOT a redesign when added: ui-source-contract requires them.
    Each must be built with the handoff's existing visual vocabulary
    (status pills, skeleton of the same card geometry, existing colour tokens).

design_tokens:
  source: app/globals.css :root
  colors: {ink: '#262229', muted: '#77717a', line: '#e9e5e7', surface: '#fff', canvas: '#f7f5f6',
           coral: '#e85b37', coral-dark: '#c94527', coral-soft: '#fff0e8', green: '#158163',
           green-soft: '#eaf8f3', amber: '#b46b12', amber-soft: '#fff6df'}
  shadow: '0 12px 34px rgba(58,36,31,.07)'
  themes: [light, dark, system]
  theme_mechanism: 'class `theme-light` / `theme-dark` / `theme-system` on the root element,
                    plus `theme-dark` when system dark is active'

assets:
  - {path: public/alta-logo.png, use: 'brand mark in login topbar, sidebar brand, sidebar footer'}
  - {path: public/favicon.svg,   use: favicon}
  - {path: public/file.svg,      use: unreferenced by page.tsx/action-overlays.tsx}
  - {path: public/globe.svg,     use: unreferenced}
  - {path: public/window.svg,    use: unreferenced}

fonts:
  handoff: 'Geist and Geist_Mono loaded through next/font/google in app/layout.tsx,
            exposed as --font-geist-sans / --font-geist-mono'
  migration_requirement: >-
    apps/web has no Next.js. Self-host Geist/Geist Mono (woff2) under apps/web/public/fonts
    and declare @font-face with the same CSS variable names so globals.css is unchanged.
    Do not substitute a different family — typography is part of visual acceptance.

icons:
  - {source: 'app/ui-icons.tsx :: UiIcon', names: [search, filter, upload, plus, more, check, mail,
     lock, eye, eyeOff, arrowRight, chevronDown, chevronLeft, chevronRight, refresh, expand, help]}
  - {source: 'app/page.tsx :: NavIcon',    names: [compose, drafts, recipients, templates, settings, history]}

client_side_persistence:
  - {key: 'ecs-theme',   values: [light, dark, system], keep: true,  note: 'legitimate UI preference; may stay client-side or move to user prefs'}
  - {key: 'ecs-sidebar', values: [collapsed, expanded], keep: true,  note: 'legitimate UI preference'}
  - {key: 'ecs-auth',    values: ['true'],              keep: false, note: 'MUST be removed — auth is a Secure HttpOnly cookie (ADR-006, BR-AUTH-002)'}

simulated_behaviour_to_replace:
  realtime_progress:
    - what: 'History rows carry static `progress`/`sent`/`pending`/`failed`/`eta` numbers'
      replace_with: 'GET /campaigns/{id}/progress as canonical + campaign.progress events as hints (ADR-010, ADR-016)'
  notifications:
    - what: '`notificationItems` 3 literals + `readNotifications` component state'
      replace_with: 'notification + user_notification tables, GET /notifications, PUT /{id}/read, notification.* events (ADR-011)'
  scheduling:
    - what: '`scheduleSend` overlay is presentation only'
      replace_with: 'M5-S2 (done): POST /campaigns/{id}/schedule, UTC + IANA zone (BR-SCH-002). The worker''s periodic due-scheduled-campaigns scan is the sole authority (DEC-092); the BullMQ delayed-job accelerator this note originally named is deferred as a latency-only optimization, not a correctness gap -- no acceptance criterion names it.'
  permissions:
    - what: 'profile hardcoded to `Administrator`; no gating anywhere'
      replace_with: 'server-enforced RBAC + client route/action guards (BR-AUTH-003, BR-AUTH-004)'
  mutations:
    - what: '~20 actions resolve with `toast(...)` and no state change'
      replace_with: 'real commands with idempotency keys (BR-GEN-005) and audit entries (BR-SEC-002)'

dependencies:
  reusable_as_is:
    - {name: react, handoff: 19.2.6, target: 19.2.8, action: use target version}
    - {name: tailwindcss, handoff: 4.2.1, action: 'add to apps/web via @tailwindcss/postcss; required by `@import "tailwindcss"` in globals.css'}
    - {name: typescript, handoff: 5.9.3, target: 5.9.3, action: unchanged}
  to_drop:
    - {name: next, reason: 'apps/web is Vite per ADR-004; ADR-002''s Refine choice is superseded by ADR-025'}
    - {name: vinext, reason: Next-on-Vite shim, not needed}
    - {name: wrangler / '@cloudflare/vite-plugin', reason: Cloudflare Workers deployment, not the target}
    - {name: react-server-dom-webpack, reason: RSC, not used by the target}
    - {name: drizzle-orm / drizzle-kit, reason: 'PostgreSQL + SQL migrations are the data baseline (ADR-007)'}
    - {name: eslint-config-next, reason: 'follows removal of next'}
  to_add_to_apps_web:
    - {name: '@tailwindcss/postcss + postcss', reason: 'compile `@import "tailwindcss"`'}
    - {name: '@testing-library/react + jsdom', reason: component tests}
    - {name: '@playwright/test', reason: 'E2E + visual verification at 3 viewports'}
    - {name: '@axe-core/playwright', reason: accessibility gate}
  policy: 'ADR-018 — pin exact versions, review license/security/maintenance/bundle impact before adding'

migration_strategy:
  approach: >-
    Port the handoff DOM structure and class names verbatim into apps/web React
    components under react-router. Because globals.css is keyed entirely on semantic
    class names (.app-shell, .compose-grid, .config-master-detail, …), copying it
    unchanged preserves layout, colour, typography and spacing by construction.
    Split page.tsx and action-overlays.tsx by screen/overlay into
    apps/web/src/screens/** and apps/web/src/overlays/** as each milestone claims them;
    never replace apps/web wholesale.
  order: 'M1 shell + login → M2 recipients → M3 templates → M4 compose → M5 settings → M6 history/notifications'
  invariant: 'apps/web must build and pass `pnpm check` after every slice'
