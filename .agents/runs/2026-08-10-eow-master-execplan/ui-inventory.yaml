routing:
  handoff_model: >-
    Single Next.js App Router page. Navigation is React state
    (`view`, `emailTab`, `recipientView`, `settingsTab`, `overlay`).
    No URL is addressable; reload always returns to `compose`.
  production_model: >-
    react-router-dom 7 (already a dependency of apps/web). Addressable routes
    are REQUIRED, not a redesign: BR-NOT-010 (stable deep link per actionable
    notification), BR-HIS-003 (drill-down) and BR-AUTH-004 (per-route permission
    control) cannot be satisfied by in-memory view state.
    See Decision Log DEC-003 in EXECPLAN.md.
  routes:
    - route: /login
      screen: UI-AUTH-001
      auth: public
    - route: /email/compose
      screen: UI-EMAIL-001
      auth: authenticated
      default_after_login: true
    - route: /email/drafts
      screen: UI-EMAIL-002
      auth: authenticated
    - route: /recipients
      screen: UI-REC-001
      auth: authenticated
    - route: /recipients/lists
      screen: UI-REC-002
      auth: authenticated
    - route: /recipients/tags
      screen: UI-REC-003
      auth: authenticated
    - route: /recipients/imports
      screen: UI-REC-004
      auth: authenticated
    - route: /templates
      screen: UI-TPL-001
      auth: authenticated
    - route: /settings/senders
      screen: UI-CFG-001
      auth: admin
    - route: /settings/policy
      screen: UI-CFG-002
      auth: admin
    - route: /history
      screen: UI-HIS-001
      auth: authenticated
    - route: /history/:campaignId
      screen: UI-HIS-002
      auth: authenticated
      note: handoff renders this as the `historyDetail` drawer; route makes it deep-linkable

