# ---------------------------------------------------------------------------
# Contract drift found during discovery
# ---------------------------------------------------------------------------

contract_drift:
  - id: DRIFT-01
    severity: high
    what: 'apps/web listens for `campaign.progress.updated`; the contract event is `campaign.progress`'
    where: [apps/web/src/App.tsx, contracts/asyncapi.yaml, catalog/realtime-events.json]
    resolution: 'asyncapi.yaml is the realtime source of truth → rename the client listener. Fixed in M6-S1.'
  - id: DRIFT-02
    severity: high
    what: 'openapi.yaml covers 13 paths; catalog/api-baseline.json describes 30 endpoint groups'
    resolution: 'expand openapi.yaml additively per milestone in each `*-contracts` node; never break existing shapes'
  - id: DRIFT-03
    severity: medium
    what: 'catalog/entities.json names `organizations`, `sender_accounts`, `campaign_executions`,
           `message_attempts`, `delivery_events`, `async_jobs`, `idempotency_keys`;
           001_initial.sql names `tenant` and has none of the latter six'
    resolution: 'database migrations are the data baseline (approval scope). Keep `tenant`;
                 add the six missing aggregates as forward migrations 002-00N. Never edit 001_initial.sql.'
  - id: DRIFT-04
    severity: medium
    what: 'catalog/open-decisions.json OD-08 prefers SSE + polling; api-baseline.json lists
           GET /campaigns/{id}/events (SSE). ADR-009 (Accepted) selects Socket.IO and
           contracts/asyncapi.yaml specifies a wss /realtime channel set.'
    resolution: 'Accepted ADR + asyncapi.yaml win. OD-08 is superseded, not violated. Recorded as DEC-004.'
  - id: DRIFT-05
    severity: low
    what: 'ADR-007 selects TypeORM migrations; the repository ships raw SQL under database/migrations
           with a checksum-guarded database/migrate.sh, and ADR-024 makes that shell job the
           deployment contract'
    resolution: 'keep raw SQL as the deployment-critical migration path (ADR-024 is newer and
                 operationally binding); use TypeORM for entity mapping only. Recorded as DEC-002.'
  - id: DRIFT-06
    severity: low
    what: 'ADR-002/docs/source-selection.md select Refine CORE; apps/web declares @refinedev/core
           5.0.12 but no source file imports it'
    resolution: 'adopt Refine data/auth/access providers during M1-M2, or supersede ADR-002 with a
                 new ADR if it is not carrying weight. Not a planning-time STOP gate.'

