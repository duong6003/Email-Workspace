blockers:
  - id: BLK-01
    severity: low
    what: '`pnpm` is not on PATH; nested `pnpm typecheck` inside the `check` script fails'
    evidence: "first baseline run: \"'pnpm' is not recognized as an internal or external command\""
    resolution: 'resolved in-run via `corepack enable --install-directory %LOCALAPPDATA%\corepack-shims`
                 and prepending it to PATH; document in the run README, do not modify user shell config'
  - id: BLK-02
    severity: medium
    what: 'UI handoff is `ready` but `registered: false` (no installed.json fingerprint record)'
    evidence: 'ui_handoff.py status output'
    resolution: 'run `python scripts/ui_handoff.py register` in node `ui_intake_register` before M1 frontend work'
  - id: BLK-03
    severity: medium
    what: 'no `.env`, so the real one-command deployment path cannot be validated'
    evidence: 'Test-Path .env → False'
    resolution: 'node M7-S4 creates `.env` from `.env.deploy.example` with locally generated secrets;
                 secrets never enter the repository or the plan'
  - id: BLK-04
    severity: high
    what: 'apps/api has no database layer at all — no TypeORM, no pg driver, no entities, no DATABASE_URL use'
    evidence: 'apps/api/package.json dependencies list contains no persistence package;
               no src file imports a database client'
    resolution: 'node M1-S0 (arch_contracts) introduces the persistence foundation before any slice'
  - id: BLK-05
    severity: high
    what: 'contracts/openapi.yaml declares 13 paths with no request bodies and almost no schemas,
           while catalog/api-baseline.json describes 30 endpoint groups'
    evidence: 'openapi.yaml is 4117 bytes; api-baseline.json lists auth/refresh, logout, recipients/{id},
               bulk-jobs, imports, lists, tags, custom-fields, templates/publish, preview,
               audience-preview, pause, resume, history, sender-accounts, webhooks, audit-logs — none present'
    resolution: 'arch_contracts expands OpenAPI additively per milestone; openapi.yaml stays the HTTP
                 source of truth and api-baseline.json is treated as the reviewed intent'

