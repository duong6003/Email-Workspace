# ---------------------------------------------------------------------------
# 4. Test layers per slice
# ---------------------------------------------------------------------------

test_layers:
  unit:
    owns: [policy decisions, state machines, variable resolution, progress arithmetic,
           idempotency key derivation, timezone/DST conversion]
    tool: vitest
    location: 'co-located *.test.ts next to the unit under test'
  integration:
    owns: [PostgreSQL constraints and tenant scoping, transactional outbox, BullMQ jobs,
           Redis behaviour, provider/webhook adapters, migration forward-apply]
    tool: 'vitest + testcontainers-style Compose services (pnpm infra:up)'
    location: apps/api/test/integration/**
  contract:
    owns: [OpenAPI request/response conformance, AsyncAPI envelope conformance,
           backward-compatibility diff against the previous milestone]
    tool: 'schema validation in CI; the diff is a required gate step'
    location: apps/api/test/contract/**
    rule: 'Adding a field or path is allowed. Removing or narrowing anything requires a
           superseding ADR (AGENTS.md §5).'
  e2e:
    owns: 'recipient → template → snapshot → schedule/send → progress → notification → history'
    tool: '@playwright/test'
    location: apps/web/e2e/**
  security:
    owns: [cross-tenant read/write attempts, RBAC negative cases, CSRF, session fixation,
           webhook signature forgery, HTML/template injection, rate limits]
    location: apps/api/test/security/**
    rule: 'Every tenant-owned endpoint gets a cross-tenant negative test. No exceptions.'
  recovery:
    owns: [job retry, duplicate webhook, duplicate job, Redis reconnect, worker crash mid-batch,
           schedule misfire, progress reconciliation drift]
    location: apps/api/test/recovery/**
  accessibility:
    owns: [keyboard traversal, focus trap in overlays, focus return on close, visible focus ring,
           role/aria correctness, contrast in light and dark]
    tool: '@axe-core/playwright + explicit keyboard specs'
  visual:
    owns: 'handoff baseline vs production render at the three acceptance viewports'
    tool: 'Playwright screenshots; handoff baseline captured by serving the handoff source once'
    rule: 'Every material difference needs a written explanation in screen-catalog.yaml diff_notes
           (design-reference/visual-acceptance.md).'

# ---------------------------------------------------------------------------
# 5. Observability evidence per rule family
# ---------------------------------------------------------------------------

runtime_evidence:
  families:
    - {family: 'BR-AUTH-*', evidence: 'audit_log.action in [auth.login, auth.login_failed, auth.logout, auth.locked]'}
    - {family: 'BR-GEN-002 tenant', evidence: 'tenant_id present on every structured log line and span attribute'}
    - {family: 'BR-GEN-005 idempotency', evidence: 'metric eow_idempotent_replay_total{resource}'}
    - {family: 'BR-CF-* / BR-IMP-* bulk', evidence: 'audit_log.action = bulk.applied + metric eow_bulk_rows_total{result}'}
    - {family: 'BR-TPL-* publish', evidence: 'audit_log.action = template.published with template_version_id'}
    - {family: 'BR-CMP-007 snapshot', evidence: 'audit_log.action = campaign.snapshot_frozen with campaign_id + row count'}
    - {family: 'BR-SCH-*', evidence: 'audit_log.action in [schedule.created, schedule.cancelled, schedule.missed] + metric eow_schedule_misfire_total'}
    - {family: 'BR-SEND-*', evidence: 'metrics eow_send_attempt_total{result}, eow_send_retry_total, eow_provider_reject_total; trace span per batch'}
    - {family: 'BR-SEND-003 progress', evidence: 'metric eow_progress_reconcile_drift (must be 0 at completion)'}
    - {family: 'BR-NOT-*', evidence: 'metrics eow_notification_created_total, eow_notification_delivered_total, eow_notification_read_total'}
    - {family: 'BR-CFG-006 quota', evidence: 'metric eow_quota_usage_ratio + quota.threshold_reached event emission'}
    - {family: 'BR-SEC-003 PII', evidence: 'a redaction test asserting recipient custom values and email bodies never appear in logs'}
  rule: 'No log, metric or audit field may contain an unmasked recipient custom value,
         email body, session token or SMTP credential (docs/operations/security-baseline.md).'

# ---------------------------------------------------------------------------
# 6. Gate queries
# ---------------------------------------------------------------------------

gate_queries:
  per_milestone:
    - 'every allocated rule_id has status = closed (or a P1/P2 waiver with a Decision Log entry)'
    - 'every allocated test_case_id maps to at least one executing test file'
    - 'the executed test count for the milestone is > 0 and matches the registry'
    - 'every screen in scope has visual evidence at 3 viewports and all 6 required states'
    - 'openapi.yaml and asyncapi.yaml diff cleanly forward against the previous milestone tag'
    - 'every new migration applies forward and database/migrate.sh checksum logic still passes'
    - 'pnpm check exits 0 AND the test count increased'
    - 'no P0/P1 defect open, no undocumented TODO on the critical path'
  final:
    - 'all 118 BA rules + 16 notification rules closed or waived with justification'
    - 'all 159 catalogued test cases mapped and executing'
    - 'all 10 DEPLOY-* cases have real Docker evidence'
    - 'docs/delivery/definition-of-done.md satisfied clause by clause'
    - 'backup taken and restore rehearsed in an isolated Compose project with RPO/RTO recorded'
    - 'run state is terminal with evidence'
