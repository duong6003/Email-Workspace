# Traceability plan — how rule → contract → code → test → evidence is closed
# Produced by run 2026-08-10-eow-master-execplan.
#
# This file defines the CLOSURE MECHANISM and the per-milestone allocation.
# It is the checklist the completion gate re-verifies. It does not itself
# assert that any rule is implemented.

version: 1
run_id: 2026-08-10-eow-master-execplan

# ---------------------------------------------------------------------------
# 1. The chain
# ---------------------------------------------------------------------------

chain:
  links:
    - {step: 1, name: rule,             source: catalog/ba-rules.json, key: 'BR-*.id'}
    - {step: 2, name: acceptance,       source: 'catalog/ba-rules.json .acceptance', key: same id}
    - {step: 3, name: contract,         source: [contracts/openapi.yaml, contracts/asyncapi.yaml, database/migrations/*.sql]}
    - {step: 4, name: code,             source: 'apps/**, packages/**', key: 'repository-relative path'}
    - {step: 5, name: test,             source: catalog/test-cases.json, key: 'TC-*.id via .rule_ids'}
    - {step: 6, name: runtime_evidence, source: 'structured log field, metric name, or audit_log.action'}
    - {step: 7, name: deployment,       source: 'catalog/deployment-test-cases.json DEPLOY-*'}
  rule: 'A rule is closed only when all seven links exist and the test executes in CI.'

registry:
  path: .agents/runs/2026-08-10-eow-master-execplan/traceability.csv
  created_by: node `traceability-init` (first implementation node of M1)
  columns: [rule_id, priority, milestone, slice, acceptance_summary, openapi_operation_ids,
            asyncapi_channels, migration_files, code_paths, test_case_ids, test_files,
            log_or_metric_or_audit, deploy_case_ids, status]
  status_values: [not_started, in_progress, code_complete, test_passing, closed, waived]
  waiver_rule: 'A `waived` row requires a Decision Log entry in EXECPLAN.md naming the reason
                and the compensating control. P0 rules may not be waived.'
  update_trigger: 'every slice completion; the milestone gate rejects any in-scope row that is
                   not `closed`'

# ---------------------------------------------------------------------------
# 2. Screen-level traceability (Definition of Done, frontend scope)
# ---------------------------------------------------------------------------

screen_registry:
  path: .agents/runs/2026-08-10-eow-master-execplan/screen-catalog.yaml
  seed: design-reference/screen-catalog.template.yaml
  created_by: node `ui_intake_register`
  columns: [id, name, route, source_files, business_rules, api_operations, realtime_events,
            required_states, viewports, visual_baseline_path, production_render_path,
            diff_notes, test_files, status]
  screens_in_scope: [UI-AUTH-001, UI-SHELL-001, UI-EMAIL-001, UI-EMAIL-002, UI-REC-001,
                     UI-REC-002, UI-REC-003, UI-REC-004, UI-TPL-001, UI-CFG-001, UI-CFG-002,
                     UI-HIS-001, UI-HIS-002]
  overlays_in_scope: 39   # verified against the OverlayType union in action-overlays.tsx
  completion_rule: >-
    A screen is `complete` only when visual equivalence is verified at 1440x900,
    768x1024 and 390x844 AND loading, empty, error, success, permission_denied and
    (where realtime applies) reconnecting are implemented and tested.
  evidence_location: .agents/runs/2026-08-10-eow-master-execplan/evidence/visual/
  note: 'Screenshots are stored in run evidence, never in design-reference/ (visual-acceptance.md).'

