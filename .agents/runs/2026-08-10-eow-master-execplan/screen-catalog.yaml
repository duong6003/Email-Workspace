    production_render_path: .agents/runs/2026-08-10-eow-master-execplan/evidence/visual/M1-S1-signin/production/login-*.png
    states_covered:
      loading: "submit button shows login-spinner while POST /auth/login is in flight"
      empty: not_applicable_to_this_screen
      error: "generic 'Email hoặc mật khẩu không đúng.' on 401 (BR-AUTH-001 no-enumeration); distinct message on 429 lockout"
