    visual_baseline_path: null
    production_render_path: .agents/runs/2026-08-10-eow-master-execplan/evidence/visual/M4-S1-campaign-draft/production/
    states_covered:
      success: "production capture at all 3 viewports: compose-success-*.png, a real draft created through the actual API with the handoff Composer DOM plus the additive name field and live M3-S2 variable panel. M4-S2 adds compose-recipient-resolved-*.png (evidence/visual/M4-S2-audience/production/), replacing the disabled 'Chưa chọn người nhận' placeholder with the real resolved count once an audience is applied. M4-S3 adds template-picker-*.png and send-confirm-{complete,missing,waived}-*.png (evidence/visual/M4-S3-variable-policy/production/): the templatePicker overlay listing real published templates, and sendConfirm's three real gating states (complete audience with CTA gated on confirm-check, missing required variable with CTA blocked, and post-waiver with CTA unblocked). M4-S4 adds send-confirm-{idle,sending,success,error}-*.png and compose-{frozen-banner,cancelled-editable}-*.png (evidence/visual/M4-S4-snapshot/production/): sendConfirm's primary CTA is now a real terminal action against a live campaign_snapshot (BR-CMP-007/010) -- idle (gated on confirm-check), sending (CTA disabled+aria-busy, mount-scoped Idempotency-Key), sendSuccess (frozen/sendable/skipped counts), and a failed send (RFC 9457 detail shown, CTA re-enabled for retry with the same key) -- and the compose screen itself gains the frozen banner with every field read-only and a cancel-to-refresh action (BR-CF-008/BR-TPL-001/BR-TPL-012), each individually inspected at all 3 viewports rather than trusted from the green Playwright run alone. M5-S2 adds schedule-send-{idle,submitting,dst-error,lead-time-error}-*.png and compose-scheduled-{banner,locked}-*.png (evidence/visual/M5-S2-schedule/production/): a new \"Hẹn giờ\" trigger opens the real scheduleSend overlay (ScheduleSendOverlay.tsx, ported from the handoff's action-overlays.tsx scheduleSend branch) -- a real IANA zone list plus a client-side local-time/UTC preview (BR-GEN-003), the DST gap/repeat and lead/horizon 422s rendered as human copy with one-click fixes rather than a raw problem body (A19, schedule-error-copy.ts), and the same mount-scoped Idempotency-Key discipline as sendConfirm. Once scheduled, the compose screen shows a dedicated `scheduled` banner (ScheduledBanner in ComposeDraftScreen.tsx) instead of the generic frozen banner: resolved local time + zone, a live countdown to the 2-minute lock window (lock-countdown.ts), and \"Đổi giờ\"/\"Hủy lịch\" actions that disable themselves with the reason stated once inside the lock window rather than letting the user trigger a 409 (A20)."
      loading: not_captured_separately_see_diff_notes
      empty: not_applicable_to_this_screen
      error: "M4-S4 send-confirm-error-*.png: a failed sendCampaign (RFC 9457 problem detail) surfaced in-overlay with the CTA re-enabled for retry using the same Idempotency-Key."
      permission_denied: covered_by_the_shared_RequirePermission_gate_see_UI_SHELL_001
    diff_notes: >-
      M4-S1 ports the handoff Composer DOM and keeps M3-S2's live variable catalogue.
      The mandatory campaign-name Field is an additive business-rule field absent from
      the handoff, using the handoff Field vocabulary (DEC-034 precedent). Autosave
      sends serialized PATCH requests with If-Match from the last response body's version;
      the shell save indicator is real through Outlet context. Audience validation,
      preview and send remain owned by M4-S2/M4-S3/M5. The drafts search filters the
      bounded API page client-side because the approved contract has no search parameter.
      Checkpoint 7 correction: ComposeVariablesScreen.tsx (M3-S2's original standalone
      screen) was removed as a genuine dead file once ComposeDraftScreen's own inline
      variable panel superseded it (ARCH-NO-ORPHANS caught it; see EXECPLAN D-43) --
      the shared variable-catalogue.ts module it both used is untouched. M4-S2 resolves
      the recipient field: previewCampaignAudience is debounced against state.draft.audience
      and the field's dot/label/small-text now show the live actionable count and skip
      total instead of the M4-S1 placeholder. recipientPicker (below) is the overlay this
      field opens; its own visual evidence is separate
      (evidence/visual/M4-S2-audience/production/recipient-picker-*.png) since it is a
      distinct overlay component, not part of this screen's own DOM. M4-S3 replaces the
      OpenAPI stub `validateTemplateAudience` (a template-scoped preview endpoint that never
      had a real caller) with two campaign-scoped operations, `validateCampaignAudience` and
      `acceptCampaignAudienceWaiver`, both reusing the shared `renderTemplateVariables`
      engine so the P0 missing-variable check and the actual send always agree (BR-CMP-006).
      templatePicker (a minimal new overlay, not in the M4-S1/M4-S2 scope) and sendConfirm
      (ported from the handoff's action-overlays.tsx, wired to real validation/waiver data
      instead of the handoff's fixed numbers) are both new overlays this screen opens; their
      CTA's mock "send" behavior intentionally still just closes the dialog, matching M4-S1's
      own mock-button precedent, since no real send/schedule endpoint exists yet (M5-S2/M5-S3).

      M5-S2 makes scheduleSend real: ScheduleSendOverlay.tsx replaces the handoff's toast-only
      "Lên lịch gửi 121 email" CTA with a genuine `POST /campaigns/{id}/schedule`, and
      SendConfirmOverlay.tsx's own docstring no longer states "Hẹn giờ remains omitted" since
      that omission is what this node closes. The AppShell.tsx page-header's disabled "Hẹn giờ
      gửi" placeholder button (a leftover M4-S1 stub, `title="Sẽ có trong milestone tiếp theo"`)
      is removed as a direct consequence -- it duplicated the new real "Hẹn giờ" trigger inside
      the compose card itself and would otherwise sit right next to it, disabled, confusing
      real functionality with a decoy (found via the e2e locator collision this caused, not
      anticipated in the plan). The zone `<select>` cannot rely on `Intl.supportedValuesOf`
      alone: this host's ICU/CLDR data omits a bare 'UTC' entry entirely and lists
      'Asia/Saigon' rather than 'Asia/Ho_Chi_Minh' -- both are this feature's own reference
      zones throughout apps/api's tests, so ScheduleSendOverlay.tsx force-includes them
      rather than trusting enumeration to have them (found by the DST/lead-time e2e specs
      timing out on `selectOption`, not assumed). `scheduledAtUtc`/`scheduledTimezone` and a
      `scheduleLockWindowSeconds` config echo were added to `CampaignDraft`/`Campaign` (both
      contract and `asDraft()`) as an in-checkpoint additive backend patch -- CP0-CP5 had
      never needed `GET /campaigns/{id}` to expose the schedule instant or the lock-window
      config, but the persistent scheduled banner and its live countdown cannot survive a
      page reload without them.

