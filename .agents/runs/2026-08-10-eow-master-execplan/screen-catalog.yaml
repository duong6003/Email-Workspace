  - id: UI-SHELL-001
    name: Application shell
    route: all authenticated routes
    source_files: [design-reference/ui-handoff-v2/source/app/page.tsx]
    business_rules: [BR-GEN-001, BR-GEN-004, BR-AUTH-003, BR-AUTH-004, BR-NOT-001, BR-NOT-004]
    api_operations: [getCurrentUser, listNotifications]
    realtime_events: [rt.connection.ready, rt.resync_required, notification.created, notification.updated, notification.read]
    required_states: [loading, empty, error, success, permission_denied, reconnecting]
    viewports: [desktop, tablet, mobile]
    status: in_progress
    ported_to: apps/web/src/app/AppShell.tsx
    visual_baseline_path: not_captured_this_node_see_diff_notes
    production_render_path: .agents/runs/2026-08-10-eow-master-execplan/evidence/visual/M1-S1-signin/production/shell-*.png;.agents/runs/2026-08-10-eow-master-execplan/evidence/visual/M1-S2-rbac/production/permission-denied-*.png;.agents/runs/2026-08-10-eow-master-execplan/evidence/visual/M1-GATE/production/system-error-*.png;.agents/runs/2026-08-10-eow-master-execplan/evidence/visual/M6-GATE/production/notifications-popover-reconnecting-*.png
    states_covered:
      loading: "RequireAuth shows a minimal auth-loading state while GET /auth/me resolves"
      success: "sidebar/utility-bar/page-header/footer chrome render with the real signed-in user (name/role from /auth/me)"
      permission_denied: >-
        M1-S2: real, server-verified RBAC (BR-AUTH-003/004). GET /auth/me
        returns the caller's real permissions (session:manage/campaign:read/
        campaign:manage/content:manage/settings:manage/notification:read,
        resolved server-side from user_role -> role_permission). AppShell
        filters navGroups by permission (apps/web/src/app/nav.ts's
        requiredPermission), so a role that cannot use a destination never
        sees it in the sidebar; every route under the shell is wrapped in
        apps/web/src/auth/RequirePermission.tsx, which renders
        apps/web/src/screens/errors/PermissionDeniedScreen.tsx in place
        (not a redirect) for a role lacking the route's permission -- e.g. a
        Viewer typing /settings/senders directly. Built from the handoff's
        existing module-card/workspace-module-frame layout and .status pill
        vocabulary plus the existing `lock` icon (no new visual language;
        the handoff itself has no permission_denied state to port, so there
        is no baseline to diff against -- see diff_notes). Independently,
        every server route also 403s for real (RFC 9457 problem, audit_log
        rbac.denied with actor+endpoint) regardless of what the client
        renders -- proven directly via API call in
        apps/web/e2e/rbac.spec.ts's TC-AUTH-009 test, not just inferred
        from the UI.
      reconnecting: "M6-S1 built the mechanism (useRealtimeStatus() mapping the shared socket's connect/disconnect lifecycle to a display status) but the shell itself only ever showed it via pages that happened to open the socket. M6-S2's NotificationPopover gained its own 'Đang kết nối lại…' banner at M6-GATE CP5 (BR-NOT-012 client half) and is captured at all 3 viewports at M6-GATE CP6 (notifications-popover-reconnecting-{desktop,tablet,mobile}.png) -- CP6 also found and fixed a CSS negative-margin defect that had the banner overlapping the popover header (D-138), confirmed by individually inspecting each screenshot before and after the fix."
      empty: not_applicable_to_chrome_itself
      error: >-
        M1-S3: implemented by apps/web/src/screens/errors/SystemErrorScreen.tsx,
        rendered by RequireAuth in place of the shell for any non-401
        session-check failure (e.g. a genuine backend 500/network outage),
        distinct from the 401 case which still redirects to /login. Built
        as its own <main>/<h1> landmark (unlike PermissionDeniedScreen,
        which is always nested inside AppShell's own landmarks) because it
        fully replaces the page — an axe landmark-one-main/page-has-main
        regression found and fixed during M1-S3 (see EXECPLAN D-28).
        Verified end-to-end via apps/web/e2e/errors.spec.ts (real-500 route
        interception, "Thử lại" retry recovers the real shell, axe scan
        clean beyond the known color-contrast finding). Visual evidence was
        not captured until M1-GATE noticed the gap: this field previously
        still said "deferred_to_M1-S3" after that node had already shipped
        the screen — M1-GATE closed it by adding a production-only capture
        block to visual-capture.spec.ts (no handoff baseline exists for
        this state, same as permission_denied) and running it for real; see
        evidence/visual/M1-GATE/production/system-error-*.png.
    diff_notes: >-
      Sidebar, utility bar, page header and footer DOM/classes are ported
      verbatim from app/page.tsx L277-309. Command palette, help center,
      notification popover and the profile dropdown overlay
      (action-overlays.tsx, 39 overlay types) are out of this node's scope
      (M2-M7); their trigger buttons are present with the handoff's DOM but
      show a "coming soon" toast instead of opening an unbuilt overlay,
      rather than doing nothing silently or faking an overlay. Sign-out is
      wired directly to the profile button (POST /auth/logout with CSRF)
      instead of going through the not-yet-ported profile overlay — a
      deliberate, documented simplification (see EXECPLAN Decision Log) so
      "wire sign-out" is genuinely real rather than a stub, without
      building the full overlay system this node does not own. A handoff
      baseline screenshot for the shell was not captured: the handoff's own
      dev runtime (Next.js 16 + vinext + Cloudflare Workers RSC) falls back
      to a native full-page form submit before React hydration attaches the
      client onSubmit handler in that environment, so the mocked login could
      not be automated through to the shell — visual equivalence is instead
      evidenced by production screenshots at all 3 viewports plus verbatim
      DOM/CSS construction (see EXECPLAN §12 "holds by construction").

      M1-S2 addendum: permission_denied has no handoff baseline to diff
      against (confirmed absent from design-reference/ui-source-
      contract.yaml's required_states gap at ui_intake), so only a
      production render exists (3 viewports, captured via
      apps/web/e2e/visual-capture.spec.ts's new "M1-S2 permission_denied"
      block). The only new visual surface added beyond the handoff's own
      tokens/classes is a .status.danger CSS rule (globals.css, appended
      at the file's end with an explanatory comment, not interleaved into
      the byte-identical-ported body) that reuses the existing
      --color-danger token and the exact color-mix(...) tint pattern
      .login-error span already uses -- i.e. it extends established
      vocabulary rather than introducing new color/typography. Also fixed a
      real, previously-undiscovered axe landmark-unique violation on
      AppShell's two unlabelled <nav> elements (sidebar + footer) while
      building this screen's a11y test -- M1-S1 only ever axe-scanned the
      public /login screen, which has no sidebar, so this defect existed
      since M1-S1 but was never exercised until M1-S2's permission_denied
      test ran axe against an authenticated route for the first time. Fixed
      with aria-label on both <nav> elements (zero visual change; same
      category as M1-S1's tabIndex=-1 fix, not a design-token decision like
      the still-tracked color-contrast finding).

