<!--
  FROZEN SAMPLE -- do not edit.

  S7 Task 43 decision 4.2. The sanitizer-report design's acceptance said the
  report must "name all 16" declarations the block audit found by hand. That
  yardstick stopped measuring anything: ADR-040 allowed 3 of those back,
  ADR-042 another 4, and S2 Task 5/6 fixed the rest in the emitter, so running

  This file replaces it. It is imported HTML, which is what S7 is about -- the
  builder's own output has its own gate in builder-block-sanitizer.test.ts, and

  Every one of the six loss kinds appears here exactly once, so the expected

    stylesheet  the <style> block below carrying url(...)
    media       the @media rule in the surviving stylesheet
    tag         <script> and <iframe>
    image       the hero, pointed at http://
    attribute   aria-label on the social link
